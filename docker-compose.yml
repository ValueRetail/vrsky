version: '3.8'

services:
  # NATS message broker
  nats:
    image: nats:2.10-alpine
    container_name: vrsky-nats
    ports:
      # Client port
      - "127.0.0.1:4222:4222"
      # Management port
      - "127.0.0.1:8222:8222"
    command:
      - "-m"   # Enable management port
      - "8222"
      # JetStream: at-least-once delivery + DLQ for data-flow streams (#70).
      # Control-plane (vrsky.commands.*) still uses core NATS.
      - "-js"
      - "-sd"
      - "/data"
    volumes:
      - nats-jetstream:/data
    networks:
      - vrsky-network
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "4222"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # PostgreSQL source database (for consumer)
  postgres-source:
    image: postgres:16-alpine
    container_name: vrsky-postgres-source
    environment:
      POSTGRES_DB: source_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: source_password
    # Use command to set runtime parameters (POSTGRES_INITDB_ARGS only affects initdb)
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_wal_senders=10"
      - "-c"
      - "max_replication_slots=10"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-source-data:/var/lib/postgresql/data
    networks:
      - vrsky-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # PostgreSQL target database (for producer)
  postgres-target:
    image: postgres:16-alpine
    container_name: vrsky-postgres-target
    environment:
      POSTGRES_DB: target_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: target_password
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-target-data:/var/lib/postgresql/data
    networks:
      - vrsky-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # HTTP test endpoint (httpbin)
  httpbin:
    image: kennethreitz/httpbin:latest
    container_name: vrsky-httpbin
    ports:
      - "127.0.0.1:8080:80"
    networks:
      - vrsky-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/status/200"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # Prometheus monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: vrsky-prometheus
    ports:
      - "127.0.0.1:9099:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    volumes:
      - ./infrastructure/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - vrsky-network
    depends_on:
      - postgres-consumer
      - postgres-producer
    restart: unless-stopped

  # PostgreSQL Consumer (CDC from source to NATS)
  postgres-consumer:
    build:
      context: .
      dockerfile: src/cmd/postgres-consumer/Dockerfile
    container_name: vrsky-postgres-consumer
    environment:
      # Source PostgreSQL configuration
      POSTGRES_INPUT_HOST: postgres-source
      POSTGRES_INPUT_PORT: 5432
      POSTGRES_INPUT_USER: postgres
      POSTGRES_INPUT_PASSWORD: source_password
      POSTGRES_INPUT_DATABASE: source_db
      POSTGRES_INPUT_REPLICATION_SLOT: vrsky_slot
      POSTGRES_INPUT_PUBLICATION: vrsky_publication
      POSTGRES_INPUT_BATCH_SIZE: "100"
      # NATS configuration
      NATS_URL: nats://nats:4222
      POSTGRES_INPUT_SUBJECT: postgres.changes
      # Backoff configuration (exponential backoff with jitter)
      POSTGRES_INPUT_INITIAL_BACKOFF_MS: "1000"
      POSTGRES_INPUT_MAX_BACKOFF_MS: "30000"
      POSTGRES_INPUT_MAX_RETRIES: "3"
      # DLQ configuration
      POSTGRES_INPUT_DLQ_ENABLED: "true"
      POSTGRES_INPUT_DLQ_SUBJECT: "postgres.dlq"
      POSTGRES_INPUT_DLQ_MAX_RETRIES: "3"
      # Logging
      LOG_LEVEL: info
    depends_on:
      nats:
        condition: service_healthy
      postgres-source:
        condition: service_healthy
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - vrsky-network
    restart: unless-stopped

  # PostgreSQL Producer (CDC from NATS to target database)
  postgres-producer:
    build:
      context: .
      dockerfile: src/cmd/postgres-producer/Dockerfile
    container_name: vrsky-postgres-producer
    environment:
      # Target PostgreSQL configuration
      POSTGRES_OUTPUT_HOST: postgres-target
      POSTGRES_OUTPUT_PORT: 5432
      POSTGRES_OUTPUT_USER: postgres
      POSTGRES_OUTPUT_PASSWORD: target_password
      POSTGRES_OUTPUT_DATABASE: target_db
      POSTGRES_OUTPUT_BATCH_SIZE: "100"
      POSTGRES_CONFLICT_RESOLUTION: UPSERT
      # NATS configuration
      NATS_URL: nats://nats:4222
      POSTGRES_OUTPUT_SUBJECT: postgres.changes
      # Backoff configuration (exponential backoff with jitter)
      POSTGRES_OUTPUT_INITIAL_BACKOFF_MS: "1000"
      POSTGRES_OUTPUT_MAX_BACKOFF_MS: "30000"
      POSTGRES_OUTPUT_MAX_RETRIES: "3"
      # DLQ configuration
      POSTGRES_OUTPUT_DLQ_ENABLED: "true"
      POSTGRES_OUTPUT_DLQ_SUBJECT: "postgres.dlq"
      POSTGRES_OUTPUT_DLQ_MAX_RETRIES: "3"
      # Logging
      LOG_LEVEL: info
    depends_on:
      nats:
        condition: service_healthy
      postgres-target:
        condition: service_healthy
    ports:
      - "127.0.0.1:9091:9091"
    networks:
      - vrsky-network
    restart: unless-stopped

  # Producer service (optional - can run locally for development)
  producer:
    build:
      context: .
      dockerfile: src/cmd/producer/Dockerfile
    container_name: vrsky-producer
    environment:
      # Input configuration: subscribe to NATS topic
      INPUT_TYPE: "nats"
      INPUT_CONFIG: '{"url":"nats://nats:4222","topic":"test.>"}'
      
      # Output configuration: POST to httpbin
      OUTPUT_TYPE: "http"
      OUTPUT_CONFIG: '{"url":"http://httpbin:80/post","method":"POST","retries":1}'
      
      # Logging (optional - structured JSON logging is default)
      LOG_LEVEL: "info"
    depends_on:
      - nats
      - httpbin
    networks:
      - vrsky-network
    restart: unless-stopped

  # Filter service - applies Priority 1/2/3 filtering, routing, and rate limiting
  filter:
     build:
       context: .
       dockerfile: src/cmd/filter/Dockerfile
     container_name: vrsky-filter
     environment:
       # Filter configuration
       FILTER_ID: "order-processor-filter"
       INPUT_TOPIC: "postgres.changes"
       OUTPUT_TOPIC: "filter.output"
       REJECTION_TOPIC: "filter.rejection"
       
       # NATS configuration
       NATS_URL: "nats://nats:4222"
       
       # Logging
       LOG_LEVEL: "info"
     depends_on:
       nats:
         condition: service_healthy
       postgres-consumer:
         condition: service_started
     ports:
       - "127.0.0.1:9092:9090"
     networks:
       - vrsky-network
     restart: unless-stopped

  # Management API - Control plane for orchestrating data pipelines
  management-api:
    build:
      context: .
      dockerfile: src/cmd/management-api/Dockerfile
    container_name: vrsky-management-api
    environment:
      # Server configuration
      MGMT_API_LISTEN: ":3000"
      SERVICE_NAME: "VRSky Management API"
      SERVICE_VERSION: "1.0.0"
      # Local dev is plain http://localhost; Safari won't send Secure cookies
      # over http, which breaks the cookie-based OAuth/OIDC callback. Disable the
      # Secure flag for the dev stack. (Leave unset / true behind HTTPS in prod.)
      COOKIE_SECURE: "false"
      
      # Database configuration - Matches config.go: MGMT_API_DB_URL
      MGMT_API_DB_URL: "postgres://postgres:management_password@postgres-management:5432/management_db?sslmode=disable"
      
      # NATS configuration - Matches config.go: MGMT_API_NATS_URL
      MGMT_API_NATS_URL: "nats://nats:4222"
      MGMT_API_NATS_PREFIX: "vrsky"
      
      # CORS configuration - Matches config.go: MGMT_API_CORS_ORIGINS
      MGMT_API_CORS_ORIGINS: "*"
      MGMT_API_TENANT_HEADER: "X-Tenant-ID"
      
      # Logging
      LOG_LEVEL: "info"
      
      # Timeouts - Matches config.go
      MGMT_API_READ_TIMEOUT_SEC: "15"
      MGMT_API_WRITE_TIMEOUT_SEC: "30"

      # Master key for AES-256-GCM secret encryption (#66 / Phase 1A).
      # DEV-ONLY value baked into compose so a local stack starts without
      # extra setup. Generate a real key for production:
      #     openssl rand -hex 32
      # See docs/SECURITY.md for rotation procedure.
      ENCRYPTION_KEY: "${ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}"
      # Shared secret workers present (X-Service-Token) to the OAuth token
      # endpoint (#75). Dev default; set a real value in any real deployment.
      OAUTH_TOKEN_SERVICE_SECRET: "${OAUTH_TOKEN_SERVICE_SECRET:-dev-oauth-service-secret-change-me}"
    depends_on:
      nats:
        condition: service_healthy
      postgres-management:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - vrsky-network
    restart: unless-stopped

  # PostgreSQL database for management API
  postgres-management:
     image: postgres:16-alpine
     container_name: vrsky-postgres-management
     environment:
       POSTGRES_DB: management_db
       POSTGRES_USER: postgres
       POSTGRES_PASSWORD: management_password
     ports:
       - "127.0.0.1:5434:5432"
     volumes:
       - postgres-management-data:/var/lib/postgresql/data
     networks:
       - vrsky-network
     healthcheck:
       test: ["CMD-SHELL", "pg_isready -U postgres"]
       interval: 10s
       timeout: 5s
       retries: 5
       start_period: 10s
     restart: unless-stopped


  # Tenant Consumer - bridges data between tenant workspaces via NATS
  tenant-consumer:
    build:
      context: .
      dockerfile: src/cmd/tenant-consumer/Dockerfile
    container_name: vrsky-tenant-consumer
    environment:
      NATS_URL: "nats://nats:4222"
      DATABASE_URL: "postgres://postgres:management_password@postgres-management:5432/management_db?sslmode=disable"
      LOG_LEVEL: "info"
    depends_on:
      nats:
        condition: service_healthy
      postgres-management:
        condition: service_healthy
    networks:
      - vrsky-network
    restart: unless-stopped

  # File Consumer - watches directories and accepts file uploads, publishes to NATS
  file-consumer:
    build:
      context: .
      dockerfile: src/cmd/file-consumer/Dockerfile
    container_name: vrsky-file-consumer
    environment:
      NATS_URL: "nats://nats:4222"
      DATABASE_URL: "postgres://postgres:management_password@postgres-management:5432/management_db?sslmode=disable"
      LOG_LEVEL: "info"
      # Aux HTTP port the SDK serves /upload, /events (SSE) + /sample-data on
      # (UI connects here). Health is on 8080 (HEALTH_PORT).
      WORKER_HTTP_PORT: "9200"
      FILE_CONSUMER_BASE_DIR: "/data/input"
      HOST_HOME: "${HOME}"
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - ./data/input:/data/input
      - ${HOME}:${HOME}
    depends_on:
      nats:
        condition: service_healthy
      postgres-management:
        condition: service_healthy
    networks:
      - vrsky-network
    restart: unless-stopped

  # Webhook Consumer - receives inbound HTTP webhooks and publishes to NATS
  webhook-consumer:
    build:
      context: .
      dockerfile: src/cmd/webhook-consumer/Dockerfile
    container_name: vrsky-webhook-consumer
    environment:
      NATS_URL: "nats://nats:4222"
      DATABASE_URL: "postgres://postgres:management_password@postgres-management:5432/management_db?sslmode=disable"
      LOG_LEVEL: "info"
      # Aux HTTP port the SDK serves /webhook, /sample-data + /tunnel/* on (UI
      # connects here; the cloudflared tunnel forwards to it). Health is on 8080.
      WORKER_HTTP_PORT: "9100"
      # Must match management-api's ENCRYPTION_KEY — the resolver decrypts
      # secrets (e.g. HMAC signing key from #67) at connection-start time.
      ENCRYPTION_KEY: "${ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}"
    ports:
      - "127.0.0.1:9100:9100"
    depends_on:
      nats:
        condition: service_healthy
      postgres-management:
        condition: service_healthy
    networks:
      - vrsky-network
    restart: unless-stopped

  # HTTP Producer - receives data from NATS and forwards to external HTTP endpoints
  http-producer:
    build:
      context: .
      dockerfile: src/cmd/http-producer/Dockerfile
    container_name: vrsky-http-producer
    environment:
      NATS_URL: "nats://nats:4222"
      DATABASE_URL: "postgres://postgres:management_password@postgres-management:5432/management_db?sslmode=disable"
      LOG_LEVEL: "info"
      # Must match management-api's ENCRYPTION_KEY — the resolver decrypts
      # *_secret_id references (e.g. an encrypted auth-header value) before sending.
      ENCRYPTION_KEY: "${ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}"
      # Aux HTTP port the SDK serves the /events SSE stream on (UI connects here).
      WORKER_HTTP_PORT: "9400"
      NATS_SUBSCRIPTION_TOPIC: "vrsky.data.*.pipeline.*"
      # OAuth output (#97): resolve access tokens for nodes with auth_type=oauth.
      MGMT_API_URL: "http://management-api:3000"
      OAUTH_TOKEN_SERVICE_SECRET: "${OAUTH_TOKEN_SERVICE_SECRET:-dev-oauth-service-secret-change-me}"
    ports:
      - "127.0.0.1:9400:9400"
    depends_on:
      nats:
        condition: service_healthy
      postgres-management:
        condition: service_healthy
    networks:
      - vrsky-network
    restart: unless-stopped

  # File Producer - receives data from NATS and writes to files
  file-producer:
    build:
      context: .
      dockerfile: src/cmd/file-producer/Dockerfile
    container_name: vrsky-file-producer
    environment:
      FILE_OWNER_UID: "${UID:-1000}"
      FILE_OWNER_GID: "${GID:-1000}"
      NATS_URL: "nats://nats:4222"
      DATABASE_URL: "postgres://postgres:management_password@postgres-management:5432/management_db?sslmode=disable"
      LOG_LEVEL: "info"
      FILE_OUTPUT_NATS_URL: "nats://nats:4222"
      FILE_OUTPUT_SUBSCRIBE_SUBJECT: "vrsky.data.*.pipeline.*"
      FILE_OUTPUT_DIR: "/data/output"
      FILE_PRODUCER_HTTP_PORT: "9900"
      HOST_HOME: "${HOME}"
    depends_on:
      nats:
        condition: service_healthy
      postgres-management:
        condition: service_healthy
    ports:
      - "127.0.0.1:9900:9900"
    volumes:
      - ${HOME}:${HOME}
      - ./data/output:/data/output
    networks:
      - vrsky-network
    restart: unless-stopped

  # Data Converter - transforms data payloads between consumer and producer
  data-converter:
    build:
      context: .
      dockerfile: src/cmd/data-converter/Dockerfile
    container_name: vrsky-data-converter
    environment:
      NATS_URL: "nats://nats:4222"
      DATABASE_URL: "postgres://postgres:management_password@postgres-management:5432/management_db?sslmode=disable"
      LOG_LEVEL: "info"
      CONVERTER_PORT: "9600"
      NATS_SUBSCRIPTION_TOPIC: "vrsky.data.*.pipeline.*"
    ports:
      - "127.0.0.1:9600:9600"
    depends_on:
      nats:
        condition: service_healthy
      postgres-management:
        condition: service_healthy
    networks:
      - vrsky-network
    restart: unless-stopped

  # DB Producer - receives data from NATS and writes to target databases
  db-producer:
    build:
      context: .
      dockerfile: src/cmd/db-producer/Dockerfile
    container_name: vrsky-db-producer
    environment:
      NATS_URL: "nats://nats:4222"
      DATABASE_URL: "postgres://postgres:management_password@postgres-management:5432/management_db?sslmode=disable"
      LOG_LEVEL: "info"
      # Must match management-api's ENCRYPTION_KEY — the resolver decrypts
      # *_secret_id references (e.g. the target-DB password) before connecting.
      ENCRYPTION_KEY: "${ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}"
      # Aux HTTP port the SDK serves /events (SSE) + /test-connection on (UI connects here).
      WORKER_HTTP_PORT: "9500"
      NATS_SUBSCRIPTION_TOPIC: "vrsky.data.*.pipeline.*"
    ports:
      - "127.0.0.1:9500:9500"
    depends_on:
      nats:
        condition: service_healthy
      postgres-management:
        condition: service_healthy
    networks:
      - vrsky-network
    restart: unless-stopped

  # Data Filter - applies filtering rules to messages in the pipeline
  # API Consumer - fetches data from external HTTP APIs
  api-consumer:
    build:
      context: .
      dockerfile: src/cmd/api-consumer/Dockerfile
    container_name: vrsky-api-consumer
    environment:
      NATS_URL: "nats://nats:4222"
      DATABASE_URL: "postgres://postgres:management_password@postgres-management:5432/management_db?sslmode=disable"
      LOG_LEVEL: "info"
      # Aux HTTP port the SDK serves /sample-data on (UI connects here).
      # Health is on 8080 (HEALTH_PORT).
      WORKER_HTTP_PORT: "9800"
      # Required by the secrets resolver (#66): decrypts auth_value_secret_id
      # (endpoint bearer/api-key) before polling.
      ENCRYPTION_KEY: "${ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}"
      # OAuth token resolution (#75): where to fetch access tokens for
      # endpoints with auth_type=oauth, and the shared service secret.
      MGMT_API_URL: "http://management-api:3000"
      OAUTH_TOKEN_SERVICE_SECRET: "${OAUTH_TOKEN_SERVICE_SECRET:-dev-oauth-service-secret-change-me}"
    ports:
      - "127.0.0.1:9800:9800"
    depends_on:
      nats:
        condition: service_healthy
      postgres-management:
        condition: service_healthy
    networks:
      - vrsky-network
    restart: unless-stopped

  # Salesforce Consumer - polls Salesforce via SOQL, authed by an OAuth grant (#79)
  salesforce-consumer:
    build:
      context: .
      dockerfile: src/cmd/salesforce-consumer/Dockerfile
    container_name: vrsky-salesforce-consumer
    environment:
      NATS_URL: "nats://nats:4222"
      DATABASE_URL: "postgres://postgres:management_password@postgres-management:5432/management_db?sslmode=disable"
      LOG_LEVEL: "info"
      # OAuth token resolution (#75): fetch access tokens for the configured grant.
      MGMT_API_URL: "http://management-api:3000"
      OAUTH_TOKEN_SERVICE_SECRET: "${OAUTH_TOKEN_SERVICE_SECRET:-dev-oauth-service-secret-change-me}"
    depends_on:
      nats:
        condition: service_healthy
      postgres-management:
        condition: service_healthy
    networks:
      - vrsky-network

  # SFTP Consumer (#76) - watches a remote SFTP dir, fetches + publishes files.
  sftp-consumer:
    build:
      context: .
      dockerfile: src/cmd/sftp-consumer/Dockerfile
    container_name: vrsky-sftp-consumer
    environment:
      NATS_URL: "nats://nats:4222"
      DATABASE_URL: "postgres://postgres:management_password@postgres-management:5432/management_db?sslmode=disable"
      LOG_LEVEL: "info"
      # Must match management-api's ENCRYPTION_KEY — the resolver decrypts the
      # SFTP password / private key (*_secret_id) at connection-start time.
      ENCRYPTION_KEY: "${ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}"
    depends_on:
      nats:
        condition: service_healthy
      postgres-management:
        condition: service_healthy
    networks:
      - vrsky-network

  # SFTP Producer (#76) - uploads each pipeline message as a file to a remote
  # SFTP directory, named from a template.
  sftp-producer:
    build:
      context: .
      dockerfile: src/cmd/sftp-producer/Dockerfile
    container_name: vrsky-sftp-producer
    environment:
      NATS_URL: "nats://nats:4222"
      DATABASE_URL: "postgres://postgres:management_password@postgres-management:5432/management_db?sslmode=disable"
      LOG_LEVEL: "info"
      # Must match management-api's ENCRYPTION_KEY — the resolver decrypts the
      # SFTP password / private key (*_secret_id) at message-delivery time.
      ENCRYPTION_KEY: "${ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}"
    depends_on:
      nats:
        condition: service_healthy
      postgres-management:
        condition: service_healthy
    networks:
      - vrsky-network

  # Test SFTP server (atmoz/sftp) for local + CI testing of #76. user: vrsky,
  # password: vrsky, with an /upload directory writable by the user.
  sftp-test:
    image: atmoz/sftp:alpine
    container_name: vrsky-sftp-test
    command: "vrsky:vrsky:::upload"
    ports:
      - "127.0.0.1:2222:22"
    networks:
      - vrsky-network

  # Kafka Consumer (#77) - subscribes to a topic (consumer group), publishes to
  # the pipeline, committing the offset only after a successful publish.
  kafka-consumer:
    build:
      context: .
      dockerfile: src/cmd/kafka-consumer/Dockerfile
    container_name: vrsky-kafka-consumer
    environment:
      NATS_URL: "nats://nats:4222"
      DATABASE_URL: "postgres://postgres:management_password@postgres-management:5432/management_db?sslmode=disable"
      LOG_LEVEL: "info"
      # Must match management-api's ENCRYPTION_KEY — the resolver decrypts the
      # SASL password / TLS client key (*_secret_id) at connection-start time.
      ENCRYPTION_KEY: "${ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}"
    depends_on:
      nats:
        condition: service_healthy
      postgres-management:
        condition: service_healthy
    networks:
      - vrsky-network

  # Kafka Producer (#77) - publishes each pipeline message to a topic (acks=all).
  kafka-producer:
    build:
      context: .
      dockerfile: src/cmd/kafka-producer/Dockerfile
    container_name: vrsky-kafka-producer
    environment:
      NATS_URL: "nats://nats:4222"
      DATABASE_URL: "postgres://postgres:management_password@postgres-management:5432/management_db?sslmode=disable"
      LOG_LEVEL: "info"
      # Must match management-api's ENCRYPTION_KEY — the resolver decrypts the
      # SASL password / TLS client key (*_secret_id) at message-delivery time.
      ENCRYPTION_KEY: "${ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}"
    depends_on:
      nats:
        condition: service_healthy
      postgres-management:
        condition: service_healthy
    networks:
      - vrsky-network

  # Test Kafka broker (apache/kafka, KRaft single-node, PLAINTEXT) for local +
  # CI testing of #77. Reachable in-network at kafka-test:9092.
  kafka-test:
    image: apache/kafka:3.7.0
    container_name: vrsky-kafka-test
    environment:
      KAFKA_NODE_ID: "0"
      KAFKA_PROCESS_ROLES: "controller,broker"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "0@kafka-test:9093"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka-test:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
    networks:
      - vrsky-network
    restart: unless-stopped

  # RabbitMQ Consumer (#78) - consumes a queue (AMQP), publishes to the pipeline,
  # acking only after a successful publish.
  rabbitmq-consumer:
    build:
      context: .
      dockerfile: src/cmd/rabbitmq-consumer/Dockerfile
    container_name: vrsky-rabbitmq-consumer
    environment:
      NATS_URL: "nats://nats:4222"
      DATABASE_URL: "postgres://postgres:management_password@postgres-management:5432/management_db?sslmode=disable"
      LOG_LEVEL: "info"
      # Must match management-api's ENCRYPTION_KEY — the resolver decrypts the
      # AMQP password (*_secret_id) at connection-start time.
      ENCRYPTION_KEY: "${ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}"
    depends_on:
      nats:
        condition: service_healthy
      postgres-management:
        condition: service_healthy
    networks:
      - vrsky-network

  # RabbitMQ Producer (#78) - publishes each pipeline message to an exchange/
  # queue as a persistent message (delivery_mode=2).
  rabbitmq-producer:
    build:
      context: .
      dockerfile: src/cmd/rabbitmq-producer/Dockerfile
    container_name: vrsky-rabbitmq-producer
    environment:
      NATS_URL: "nats://nats:4222"
      DATABASE_URL: "postgres://postgres:management_password@postgres-management:5432/management_db?sslmode=disable"
      LOG_LEVEL: "info"
      ENCRYPTION_KEY: "${ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}"
    depends_on:
      nats:
        condition: service_healthy
      postgres-management:
        condition: service_healthy
    networks:
      - vrsky-network

  # Test RabbitMQ broker for local + CI testing of #78. Reachable in-network at
  # rabbitmq-test:5672 (guest/guest). Management UI on 15672.
  rabbitmq-test:
    image: rabbitmq:3-management
    container_name: vrsky-rabbitmq-test
    networks:
      - vrsky-network

  # Cloud Storage Consumer (#80) - polls a cloud object-storage bucket (S3 /
  # Azure Blob / GCS, chosen via config), fetches new objects, publishes them to
  # the pipeline, and applies an after-action (delete / move / leave).
  cloud-storage-consumer:
    build:
      context: .
      dockerfile: src/cmd/cloud-storage-consumer/Dockerfile
    container_name: vrsky-cloud-storage-consumer
    environment:
      NATS_URL: "nats://nats:4222"
      DATABASE_URL: "postgres://postgres:management_password@postgres-management:5432/management_db?sslmode=disable"
      LOG_LEVEL: "info"
      # Must match management-api's ENCRYPTION_KEY — the resolver decrypts the
      # cloud credentials (*_secret_id) at connection-start time.
      ENCRYPTION_KEY: "${ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}"
    depends_on:
      nats:
        condition: service_healthy
      postgres-management:
        condition: service_healthy
    networks:
      - vrsky-network

  # Cloud Storage Producer (#80) - writes each pipeline message as an object to a
  # cloud object store, keyed from a template.
  cloud-storage-producer:
    build:
      context: .
      dockerfile: src/cmd/cloud-storage-producer/Dockerfile
    container_name: vrsky-cloud-storage-producer
    environment:
      NATS_URL: "nats://nats:4222"
      DATABASE_URL: "postgres://postgres:management_password@postgres-management:5432/management_db?sslmode=disable"
      LOG_LEVEL: "info"
      # Must match management-api's ENCRYPTION_KEY — the resolver decrypts the
      # cloud credentials (*_secret_id) at message-delivery time.
      ENCRYPTION_KEY: "${ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}"
    depends_on:
      nats:
        condition: service_healthy
      postgres-management:
        condition: service_healthy
    networks:
      - vrsky-network

  # Test S3-compatible object store (MinIO) for local + CI testing of #80.
  # In-network S3 API at http://minio-test:9000 (minioadmin/minioadmin); web
  # console on 9001. Set the node's endpoint to http://minio-test:9000.
  minio-test:
    image: minio/minio:latest
    container_name: vrsky-minio-test
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "minioadmin"
      MINIO_ROOT_PASSWORD: "minioadmin"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    networks:
      - vrsky-network

  # One-shot: wait for MinIO, then create the test bucket "vrsky-bucket".
  minio-init:
    image: minio/mc:latest
    container_name: vrsky-minio-init
    depends_on:
      - minio-test
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio-test:9000 minioadmin minioadmin; do echo 'waiting for minio'; sleep 1; done;
      mc mb -p local/vrsky-bucket || true;
      echo 'minio bucket ready';
      "
    networks:
      - vrsky-network

  # Test Azure Blob emulator (Azurite) for local + CI testing of #80. In-network
  # blob endpoint at http://azurite-test:10000/devstoreaccount1. Use the standard
  # devstore connection string in the node config (account: devstoreaccount1).
  azurite-test:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    container_name: vrsky-azurite-test
    command: "azurite-blob --blobHost 0.0.0.0 --blobPort 10000"
    ports:
      - "127.0.0.1:10000:10000"
    networks:
      - vrsky-network

  # Test GCS emulator (fake-gcs-server) for local + CI testing of #80. In-network
  # API at http://fake-gcs-test:4443. Set the node endpoint to
  # http://fake-gcs-test:4443/storage/v1/ (no credentials needed).
  fake-gcs-test:
    image: fsouza/fake-gcs-server:latest
    container_name: vrsky-fake-gcs-test
    command: "-scheme http -host 0.0.0.0 -port 4443 -public-host fake-gcs-test:4443"
    ports:
      - "127.0.0.1:4443:4443"
    networks:
      - vrsky-network

  # Salesforce Producer - writes pipeline records to Salesforce (REST + Bulk API), OAuth-authed (#79)
  salesforce-producer:
    build:
      context: .
      dockerfile: src/cmd/salesforce-producer/Dockerfile
    container_name: vrsky-salesforce-producer
    environment:
      NATS_URL: "nats://nats:4222"
      DATABASE_URL: "postgres://postgres:management_password@postgres-management:5432/management_db?sslmode=disable"
      LOG_LEVEL: "info"
      MGMT_API_URL: "http://management-api:3000"
      OAUTH_TOKEN_SERVICE_SECRET: "${OAUTH_TOKEN_SERVICE_SECRET:-dev-oauth-service-secret-change-me}"
    depends_on:
      nats:
        condition: service_healthy
      postgres-management:
        condition: service_healthy
    networks:
      - vrsky-network
    restart: unless-stopped

  data-filter:
    build:
      context: .
      dockerfile: src/cmd/data-filter/Dockerfile
    container_name: vrsky-data-filter
    environment:
      NATS_URL: "nats://nats:4222"
      DATABASE_URL: "postgres://postgres:management_password@postgres-management:5432/management_db?sslmode=disable"
      LOG_LEVEL: "info"
      FILTER_PORT: "9700"
      NATS_SUBSCRIPTION_TOPIC: "vrsky.data.*.pipeline.*"
    ports:
      - "127.0.0.1:9700:9700"
    depends_on:
      nats:
        condition: service_healthy
      postgres-management:
        condition: service_healthy
    networks:
      - vrsky-network
    restart: unless-stopped

  # DB Consumer - connects to external databases and publishes query results to NATS
  db-consumer:
    build:
      context: .
      dockerfile: src/cmd/db-consumer/Dockerfile
    container_name: vrsky-db-consumer
    environment:
      NATS_URL: "nats://nats:4222"
      DATABASE_URL: "postgres://postgres:management_password@postgres-management:5432/management_db?sslmode=disable"
      LOG_LEVEL: "info"
      # Aux HTTP port the SDK serves /events (SSE) + /test-connection + /sample-data on (UI connects here).
      WORKER_HTTP_PORT: "9300"
      # Required by the secrets resolver (#66) — DB passwords are stored encrypted.
      ENCRYPTION_KEY: "${ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}"
    ports:
      - "127.0.0.1:9300:9300"
    depends_on:
      nats:
        condition: service_healthy
      postgres-management:
        condition: service_healthy
    networks:
      - vrsky-network
    restart: unless-stopped

networks:
  vrsky-network:
    driver: bridge
    name: vrsky-network

volumes:
  postgres-source-data:
    driver: local
  postgres-target-data:
    driver: local
  postgres-management-data:
    driver: local
  prometheus-data:
    driver: local
  nats-jetstream:
    driver: local

