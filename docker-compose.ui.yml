services:
  ui:
    build:
      context: .
      dockerfile: ui/Dockerfile
      target: builder
    container_name: vrsky-ui-dev
    ports:
      - "5173:5173"
    volumes:
      - ./ui:/app
      - /app/node_modules
      - /app/dist
    command: npm run dev -- --host 0.0.0.0
    profiles:
      - dev
    networks:
      - vrsky

  ui-prod:
    build:
      context: .
      dockerfile: ui/Dockerfile
      target: nginx
    container_name: vrsky-ui-prod
    ports:
      - "80:80"
    # The image runs nginx as the nginx user (uid/gid 101), which can't
    # create /var/run/nginx.pid on the image's own /var/run. Production
    # mounts an emptyDir there (infrastructure/kubernetes/ui/deployment.yaml).
    # The uid is needed: a bare tmpfs takes the image's root-owned 755 /run.
    tmpfs:
      - /var/run:uid=101,gid=101
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/index.html"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - vrsky
    profiles:
      - prod

networks:
  vrsky:
    driver: bridge
