site_name: VRSky Documentation
site_description: Operator, integrator, and API documentation for the VRSky integration platform.
docs_dir: docs

# Legacy / planning docs predating the published site. They remain in the repo
# but are not part of the docs site (they carry stale internal cross-links).
exclude_docs: |
  ACCELERATED_TIMELINE.md
  COMPLIANCE.md
  DATABASE_COMPONENTS_ARCHITECTURE.md
  DOCKER_FILE_COMPONENTS.md
  FILE_COMPONENTS_ARCHITECTURE.md
  FILE_CONSUMER_PRODUCER_CONFIG.md
  FILTER_ARCHITECTURE.md
  ISSUE_CONSOLIDATION_PLAN.md
  ISSUE_EXECUTION_ORDER.md
  LOGIC_NODE_SPEC.md
  PLUGIN_ARCHITECTURE.md
  PLUGIN_SECURITY_MODEL.md
  POC_SCOPE.md
  PROJECT_INCEPTION.md
  SERVICE_NODE_PIPELINE.md
  ARCHIVE/
  PHASE_TEMPLATES/
  PLANNING/
  tasks/

# Keep link checking strict for the curated site, but don't fail on the
# legacy/non-nav pages that are intentionally not linked.
validation:
  omitted_files: ignore
  absolute_links: ignore
  unrecognized_links: ignore

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Dark mode
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: Light mode

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences

nav:
  - Home: index.md
  - Tutorials:
      - Build your first pipeline: tutorials/first-pipeline.md
      - Build your first connector: sdk/tutorial/first-connector.md
  - Operator guide:
      - Install: operator/install.md
      - Upgrade: operator/upgrade.md
      - Backup & restore: operator/backup.md
      - Monitoring: operator/monitoring.md
      - Troubleshooting: operator/troubleshooting.md
      - Encryption-at-rest checklist: operator/encryption-at-rest.md
      - Status page & uptime SLA: SLA.md
      - Deployment guide (detailed): DEPLOYMENT_GUIDE.md
      - Disaster recovery: DR.md
  - Connectors:
      - Overview: connectors/index.md
      - HTTP & webhooks: connectors/http.md
      - REST API polling: connectors/api.md
      - Databases: connectors/database.md
      - Files: connectors/file.md
      - SFTP: connectors/sftp.md
      - Cloud storage: connectors/cloud-storage.md
      - Apache Kafka: connectors/kafka.md
      - RabbitMQ: connectors/rabbitmq.md
      - Salesforce: connectors/salesforce.md
      - Tenant-to-tenant: connectors/tenant.md
      - Filters & converters: connectors/filters-converters.md
  - Security:
      - Whitepaper: security/whitepaper.md
      - Security reference: SECURITY.md
  - API reference: reference/api.md
  - Architecture & internals:
      - Connection node spec: CONNECTION_NODE_SPEC.md
      - Tenant model: TENANT_MODEL.md
      - NATS architecture: NATS_ARCHITECTURE.md
      - Observability: OBSERVABILITY.md
      - Tracing: TRACING.md
      - Load & benchmarks: LOAD.md
      - OAuth framework: oauth-framework.md
      - SDK overview: sdk/README.md
