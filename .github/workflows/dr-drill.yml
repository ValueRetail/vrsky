name: DR Restore Drill

# Proves the backup -> restore path end to end, as close to production as CI
# gets (#86, #395):
#   - Postgres 18, database and user `vrsky`, like the management DB on AKS
#   - the real schema: every infrastructure/migrations/*.up.sql, then rows for
#     two tenants
#   - the vrsky-cli image built from its Dockerfile, run as uid 70 with a
#     read-only root filesystem and a tmpfs at /tmp, like the CronJob
#     (infrastructure/kubernetes/backup/cronjob.yaml)
#   - BACKUP_PROVIDER=azure into the container `vrsky-backups`, on Azurite
#   - restore into a separate Postgres 18 and compare row counts per tenant
#
# Weekly as well as on changes, so a drift in the base image or the schema
# shows up even when nobody touches the backup code. A red run on main opens
# an issue (ci-failure-alert.yml).

on:
  push:
    branches: [main, develop]
    paths:
      - 'src/cmd/vrsky-cli/**'
      - 'src/pkg/crypto/**'
      - 'src/pkg/objectstore/**'
      - 'infrastructure/migrations/**'
      - '.github/workflows/dr-drill.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'src/cmd/vrsky-cli/**'
      - 'src/pkg/crypto/**'
      - 'src/pkg/objectstore/**'
      - 'infrastructure/migrations/**'
      - '.github/workflows/dr-drill.yml'
  schedule:
    - cron: "0 6 * * 3" # Wednesdays 06:00 UTC; the drill needs no cluster
  workflow_dispatch:

jobs:
  restore-drill:
    name: Backup + restore drill
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # Throwaway values for a run that lives for one job. The Azurite account
      # and key are the emulator's published defaults, not a credential.
      ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      BACKUP_PROVIDER: azure
      BACKUP_BUCKET: vrsky-backups
      BACKUP_PREFIX: "mgmt-backups/"
      BACKUP_AZURE_CONNECTION_STRING: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://127.0.0.1:10000/devstoreaccount1;"
      SOURCE_DB_URL: "postgres://vrsky:vrsky@localhost:5432/vrsky?sslmode=disable"
      TARGET_DB_URL: "postgres://vrsky:vrsky@localhost:5433/vrsky?sslmode=disable"
      # Rows the seed step writes, per tenant and table, in the order the
      # count query prints them.
      EXPECTED_COUNTS: |-
        drill-a|connections|3
        drill-a|secrets|4
        drill-b|connections|2
        drill-b|secrets|1

    services:
      source-db:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: vrsky
          POSTGRES_USER: vrsky
          POSTGRES_PASSWORD: vrsky
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vrsky" --health-interval 5s
          --health-timeout 5s --health-retries 10
      target-db:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: vrsky
          POSTGRES_USER: vrsky
          POSTGRES_PASSWORD: vrsky
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U vrsky" --health-interval 5s
          --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v5

      # The image production runs, not a `go build` on the runner: pg_dump and
      # pg_restore come from its postgres:18-alpine base.
      - name: Build the vrsky-cli image
        run: docker build -f src/cmd/vrsky-cli/Dockerfile -t vrsky-cli:drill .

      - name: Start Azurite + create the container
        run: |
          docker run -d --name azurite -p 10000:10000 \
            mcr.microsoft.com/azure-storage/azurite:3.34.0 \
            azurite-blob --blobHost 0.0.0.0 --skipApiVersionCheck --loose
          for i in $(seq 1 30); do
            if az storage container create --name "$BACKUP_BUCKET" \
                 --connection-string "$BACKUP_AZURE_CONNECTION_STRING" -o none 2>/dev/null; then
              echo "container $BACKUP_BUCKET ready"; exit 0
            fi
            echo "waiting for azurite… [$i/30]"; sleep 2
          done
          echo "Azurite did not come up"; docker logs azurite; exit 1

      - name: Apply the migrations to the source database
        run: |
          docker run --rm --network host -e SOURCE_DB_URL \
            -v "$PWD/infrastructure/migrations":/migrations:ro \
            --entrypoint sh vrsky-cli:drill -c '
              set -e
              for f in /migrations/*.up.sql; do
                echo "apply $(basename "$f")"
                psql "$SOURCE_DB_URL" -v ON_ERROR_STOP=1 -q -f "$f"
              done'

      - name: Seed two tenants
        run: |
          docker run --rm -i --network host -e SOURCE_DB_URL --entrypoint sh vrsky-cli:drill \
            -c 'psql "$SOURCE_DB_URL" -v ON_ERROR_STOP=1 -q' <<'SQL'
          INSERT INTO users (id, email, password_hash, status) VALUES
            ('00000000-0000-0000-0000-0000000000a1', 'owner-a@drill.test', 'x', 'active'),
            ('00000000-0000-0000-0000-0000000000b1', 'owner-b@drill.test', 'x', 'active');
          INSERT INTO tenants (id, name, slug, owner_id) VALUES
            ('aaaaaaaa-0000-0000-0000-000000000001', 'Drill A', 'drill-a', '00000000-0000-0000-0000-0000000000a1'),
            ('bbbbbbbb-0000-0000-0000-000000000001', 'Drill B', 'drill-b', '00000000-0000-0000-0000-0000000000b1');
          INSERT INTO connections (tenant_id, name)
            SELECT 'aaaaaaaa-0000-0000-0000-000000000001', 'a-conn-' || g FROM generate_series(1, 3) g;
          INSERT INTO connections (tenant_id, name)
            SELECT 'bbbbbbbb-0000-0000-0000-000000000001', 'b-conn-' || g FROM generate_series(1, 2) g;
          INSERT INTO secrets (tenant_id, name, ciphertext)
            SELECT 'aaaaaaaa-0000-0000-0000-000000000001', 'a-secret-' || g, 'aes256:drill' FROM generate_series(1, 4) g;
          INSERT INTO secrets (tenant_id, name, ciphertext)
            SELECT 'bbbbbbbb-0000-0000-0000-000000000001', 'b-secret-' || g, 'aes256:drill' FROM generate_series(1, 1) g;
          SQL

      # Same settings as the CronJob's pod: uid 70, read-only root, /tmp only.
      - name: Backup (source -> Azurite)
        run: |
          cli() {
            docker run --rm --network host --user 70:70 --read-only --tmpfs /tmp \
              -e ENCRYPTION_KEY -e BACKUP_PROVIDER -e BACKUP_BUCKET -e BACKUP_PREFIX \
              -e BACKUP_AZURE_CONNECTION_STRING -e BACKUP_DB_URL="$SOURCE_DB_URL" \
              vrsky-cli:drill "$@"
          }
          cli backup --stamp drill
          cli list

      - name: Restore (Azurite -> target)
        run: |
          docker run --rm --network host --user 70:70 --read-only --tmpfs /tmp \
            -e ENCRYPTION_KEY -e BACKUP_PROVIDER -e BACKUP_BUCKET -e BACKUP_PREFIX \
            -e BACKUP_AZURE_CONNECTION_STRING -e BACKUP_DB_URL="$SOURCE_DB_URL" \
            vrsky-cli:drill restore --target-db-url "$TARGET_DB_URL" --confirm \
            "mgmt-backups/management_db-drill.dump.gz.enc"

      - name: Row counts per tenant match
        env:
          COUNT_QUERY: >-
            SELECT t.slug, 'connections', count(c.id) FROM tenants t
            LEFT JOIN connections c ON c.tenant_id = t.id::text GROUP BY t.slug
            UNION ALL
            SELECT t.slug, 'secrets', count(s.id) FROM tenants t
            LEFT JOIN secrets s ON s.tenant_id = t.id GROUP BY t.slug
            ORDER BY 1, 2
        run: |
          counts() {
            docker run --rm --network host -e DB="$1" -e COUNT_QUERY --entrypoint sh vrsky-cli:drill \
              -c 'psql "$DB" -v ON_ERROR_STOP=1 -tA -c "$COUNT_QUERY"'
          }
          source=$(counts "$SOURCE_DB_URL")
          target=$(counts "$TARGET_DB_URL")
          echo "expected:"; echo "$EXPECTED_COUNTS" | sed 's/^/  /'
          echo "source:";   echo "$source" | sed 's/^/  /'
          echo "target:";   echo "$target" | sed 's/^/  /'
          [ "$source" = "$EXPECTED_COUNTS" ] || { echo "::error::the seed did not write the expected rows"; exit 1; }
          [ "$target" = "$EXPECTED_COUNTS" ] || { echo "::error::DR drill failed: restored row counts differ from the source"; exit 1; }
          echo "DR drill passed: per-tenant row counts survived backup and restore"
