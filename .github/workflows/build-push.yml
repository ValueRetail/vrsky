name: Build and Push Docker Images

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - develop

env:
  REGISTRY: ghcr.io
  REGISTRY_USERNAME: ${{ github.actor }}

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    outputs:
      ui: ${{ steps.filter.outputs.ui }}
      src: ${{ steps.filter.outputs.src }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Check paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            ui:
              - 'ui/**'
            src:
              - 'src/**'
              - 'infrastructure/**'
              - 'docker-compose.yml'
              - '.github/workflows/build-push.yml'

  build-and-push:
    name: Build and Push ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          # Backend services. No producer/consumer/filter/converter entries:
          # those are the legacy per-connection worker images the orchestrator
          # stopped spawning in #201/#205 — nothing pulls them.
          #
          # postgres-consumer/postgres-producer are absent for a related reason:
          # they are CDC workers configured entirely from POSTGRES_INPUT_* env
          # vars, predating the connection-config model. "postgres" is not a node
          # type, so no tenant can build a pipeline that uses them. They survive
          # as a load-harness fixture (tests/load/) and docker-compose builds
          # them locally from source, so nothing anywhere pulls these images.
          - { name: "management-api", path: "src/cmd/management-api" }
          - { name: "data-filter", path: "src/cmd/data-filter" }
          - { name: "data-converter", path: "src/cmd/data-converter" }
          - { name: "file-consumer", path: "src/cmd/file-consumer" }
          - { name: "file-producer", path: "src/cmd/file-producer" }
          # Frontend
          - { name: "ui", path: "ui", dockerfile: "ui/Dockerfile" }

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0  # Full history for git tags

      - name: Get version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${{ github.ref_name }}"
          else
            VERSION="sha-$(git rev-parse --short HEAD)"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Version: ${VERSION}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.REGISTRY_USERNAME }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        id: docker_build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.service.dockerfile || format('{0}/Dockerfile', matrix.service.path) }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/valueretail/vrsky/${{ matrix.service.name }}:latest
            ${{ env.REGISTRY }}/valueretail/vrsky/${{ matrix.service.name }}:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image digest
        run: echo ${{ steps.docker_build.outputs.digest }}

  test:
    name: Test UI
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.ui == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        working-directory: ui
        run: npm ci

      # test:coverage, not test: vitest.config.ts declares 80/75/80/80
      # thresholds, and until now nothing ran them. The numbers were config, not
      # a gate — the suite sat at 78% statements for as long as anyone had
      # looked. Same shape as the gofmt check added in #236.
      - name: Run tests with coverage thresholds
        working-directory: ui
        run: npm run test:coverage

      - name: Build UI
        working-directory: ui
        run: npm run build

  go-tests:
    name: Go Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.sha)

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: src/go.sum

      # golangci-lint runs here without a config file, and gofmt is not in its
      # default linter set (errcheck, gosimple, govet, ineffassign, staticcheck,
      # unused). So nothing was checking formatting at all, which is how
      # cmd/sap-s4hana-producer/service.go sat unformatted on main until #236.
      # Cheap, and first, so a formatting nit fails in seconds rather than after
      # the race-enabled test run.
      - name: Check gofmt
        working-directory: src
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::not gofmt-clean:"
            echo "$unformatted" | sed 's/^/  /'
            echo
            echo "Fix with:  gofmt -w $(echo $unformatted | tr '\n' ' ')"
            exit 1
          fi
          echo "all files are gofmt-clean"

      - name: Run Go tests
        working-directory: src
        run: go test -v -race -cover ./...

      # v2, and the action must move to v8 with it. v1.64.8 was itself built
      # with Go 1.24 and refused to target 1.26 ("the Go language version used
      # to build golangci-lint is lower than the targeted Go version"), so the
      # toolchain bump forced this. Settings now live in src/.golangci.yml
      # rather than being whatever the pinned binary defaulted to.
      #
      # `cache: true` is gone: the action never accepted that input and logged
      # "Unexpected input(s) 'cache'" on every run. It caches by default.
      - name: Run Go linter
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.2
          working-directory: src
          args: --timeout=5m

      # #94: fail the build if a management-API route is served without an
      # OpenAPI registry entry (keeps /openapi.json complete).
      - name: Lint OpenAPI annotations
        working-directory: src
        run: go run ./cmd/lint-openapi
