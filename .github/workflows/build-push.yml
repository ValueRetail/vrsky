name: Build and Push Docker Images

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - develop

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      ui: ${{ steps.filter.outputs.ui }}
      src: ${{ steps.filter.outputs.src }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Check paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            ui:
              - 'ui/**'
            src:
              - 'src/**'
              - 'infrastructure/**'
              - 'docker-compose.yml'
              - '.github/workflows/build-push.yml'

  test:
    name: Test UI
    runs-on: ubuntu-latest
    needs: changes
    # On a pull request and on a push to main alike: the deploy job needs the
    # UI tests green on the merge commit, not only on the PR.
    if: needs.changes.outputs.ui == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        working-directory: ui
        run: npm ci

      # test:coverage, not test: vitest.config.ts declares 80/75/80/80
      # thresholds, and until now nothing ran them. The numbers were config, not
      # a gate — the suite sat at 78% statements for as long as anyone had
      # looked. Same shape as the gofmt check added in #236.
      - name: Run tests with coverage thresholds
        working-directory: ui
        run: npm run test:coverage

      - name: Build UI
        working-directory: ui
        run: npm run build

  # The Go tests, split over parallel runners (#436). One job running
  # `go test -race ./...` took 15 minutes, most of it pkg/managementapi, and
  # every image build waited for it. .github/scripts/go-test-shards.sh maps a
  # shard to its packages: the slow ones by name, and `rest` is whatever
  # `go list ./...` finds that no named shard holds, so a new package is
  # tested without anyone listing it. TestGoTestShardsCoverEveryPackage keeps
  # this matrix and the script in step and checks every package is covered
  # once (plans/issue-436-shard-go-tests.md).
  go-test-shards:
    name: Go Tests (${{ matrix.shard }})
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.sha)
    strategy:
      # Report every shard's failures, as the single job did, rather than
      # cancelling the others at the first red one.
      fail-fast: false
      matrix:
        shard: [managementapi, messaging, agents, rest]

    # A real Postgres for the tests that need one (src/pkg/testdb): tenant
    # isolation as the database enforces it, the advisory lock, registration
    # under a race, driver behaviour. Everything else runs on sqlmock, which
    # checks SQL text and nothing more. Each such test creates and drops its
    # own database. Throwaway credentials for a server that lives for one job.
    # Every shard gets one: database tests live in several packages, and the
    # skip check below must hold wherever they land.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true # the newest 1.26 patch, not the runner's cached one (stdlib advisories)
          cache-dependency-path: src/go.sum

      # `go test` fetches modules as it compiles, one attempt each. On
      # 2026-10-05 proxy.golang.org dropped a single download mid-stream and 41
      # packages ended in "setup failed" before a test had run: main went red
      # on a merge that changed no code path (#299, run 37309549541). Fetch
      # everything first instead, with retries (.github/actions/go-modules).
      - name: Download Go modules
        uses: ./.github/actions/go-modules

      # GOPROXY=off: every module is in the cache by now. If this step ever
      # needs one that is not, it says so on every run, instead of working
      # until the day the proxy hiccups.
      - name: Run Go tests
        working-directory: src
        env:
          GOPROXY: "off"
          VRSKY_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
        run: |
          set -o pipefail
          pkgs="$(../.github/scripts/go-test-shards.sh "${{ matrix.shard }}")"
          echo "shard ${{ matrix.shard }}: $(echo "$pkgs" | wc -l) packages"
          # shellcheck disable=SC2086 # one argument per package
          go test -v -race -cover $pkgs 2>&1 | tee "$RUNNER_TEMP/go-test.log"
          # The database tests skip themselves when the variable is missing,
          # and a skip is invisible: three of them went unrun in CI for
          # months because nothing set the variable they waited for. Here a
          # skip can only mean the variable or the service above was lost.
          if grep -q "VRSKY_TEST_POSTGRES_URL not set" "$RUNNER_TEMP/go-test.log"; then
            echo "::error::a database test was skipped in CI — VRSKY_TEST_POSTGRES_URL or the postgres service is missing"
            exit 1
          fi

      # The Postgres worker's state store (pkg/io), on a real database. These
      # sit behind the integration build tag, which the main run does not set,
      # and unlike the tests above they fail rather than skip without one.
      # pkg/io is in the `rest` shard, so they run there.
      - name: Run pkg/io state-store tests
        if: matrix.shard == 'rest'
        working-directory: src
        env:
          GOPROXY: "off"
          VRSKY_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
        run: go test -tags=integration -race -count=1 ./pkg/io/ -run PostgresStateStore

  # The alert rules are deployed to prod as a PrometheusRule; a syntax error
  # or a broken expression would otherwise only show up as a rule that never
  # fires. promtool checks the file and runs its unit tests.
  #
  # Its own job since #446: the backup alert tests (#404) evaluate up to ten
  # days of samples at one-minute steps, and `promtool test rules` took four
  # of the Go lint job's six and a half minutes, ahead of golangci-lint. Side
  # by side the two take as long as the slower one. The image pull is two
  # seconds, so it is not cached. TestEveryLintCheckStillGates keeps both
  # commands here and this job in front of the rollout.
  #
  # Still four minutes on its own, so since #464 the test groups are split
  # over four legs by name (`--run`), packed by their measured time: the
  # backup groups replay up to ten days each and take 4-12 s apiece locally,
  # the other alerts under a second. Every leg also runs `check rules` (0.2 s)
  # rather than giving one leg a step-level `if`. promtool runs nothing and
  # still says SUCCESS when `--run` matches no group, so each leg counts the
  # groups its JUnit report lists against the names it was given.
  # TestRuleTestGroupsRunOnce checks every group in the file is in exactly
  # one leg (plans/ci-speed-463-464-443.md).
  alert-rules:
    name: Alert rules (promtool ${{ matrix.leg }})
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.sha)
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: 1/4
            groups:
              - pipeline-down-polled
              - pipeline-down-after-park
              - dlq-growing
              - jetstream-lag-high
              - cert-expiry-soon
              - mgmt-api-error-rate
              - disk-usage-high
              - connection-in-error
              - remote-agent-offline
              - connector-unavailable
              - node-cpu-requests-high
              - backup-a-two-failures
              - backup-a-suspended
              - backup-a-never-succeeded
              - backup-a-own-jobs-only
              - backup-b-weekday-afternoons
              - backup-b-suspended
              - backup-suspended-parked
              - backup-suspended-pod-replaced
          - leg: 2/4
            groups:
              - backup-b-off-at-weekends
              - backup-b-after-activation
              - backup-b-late-start
          - leg: 3/4
            groups:
              - backup-c-after-activation
              - backup-c-backstop
              - backup-b-late-cluster-never-runs
          - leg: 4/4
            groups:
              - backup-b-stopped-scheduling
              - backup-b-manual-backup
              - backup-b-suspend-flicker
              - backup-suspended-late-secret
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # RULE_GROUPS, not GROUPS: bash keeps GROUPS for the user's group ids
      # and ignores an assignment to it. The image runs as nobody, who
      # cannot write the JUnit report into the runner's temp dir, hence
      # --user. The checkout is mounted read-only, so the runner user
      # cannot change it from inside the container.
      - name: Alert rules (promtool)
        env:
          RULE_GROUPS: ${{ join(matrix.groups, ' ') }}
        run: |
          docker run --rm -v "$PWD/infrastructure":/cfg:ro --entrypoint promtool prom/prometheus:v3.5.0 check rules /cfg/prometheus-rules.yml
          run_re="^($(echo $RULE_GROUPS | tr ' ' '|'))\$"
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD/infrastructure":/cfg:ro -v "$RUNNER_TEMP":/out --entrypoint promtool prom/prometheus:v3.5.0 test rules /cfg/prometheus-rules-test.yml --run="$run_re" --junit=/out/rules.xml
          want=$(echo $RULE_GROUPS | wc -w)
          ran=$(grep -o '<testcase ' "$RUNNER_TEMP/rules.xml" | wc -l)
          echo "ran $ran of the $want test groups this leg names"
          if [ "$ran" -ne "$want" ]; then
            echo "::error::promtool ran $ran test groups but this leg names $want; a name in the matrix matches no group in prometheus-rules-test.yml"
            exit 1
          fi

  # The checks that are not `go test`, beside the shards instead of after
  # them (#436): before, golangci-lint alone added two minutes to the end of
  # the single test job.
  go-lint:
    name: Go lint
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.sha)
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # setup-go's cache has one key for every Go job, and the first job to
      # save it wins: a -race test shard, whose build output golangci-lint
      # cannot reuse. Its own action cache held 1.4 MB. So golangci-lint
      # rebuilt everything on every run (2 m 20 s). This job keeps its own
      # entry instead (#463): modules, the Go build cache and golangci-lint's
      # analysis cache, keyed by Go version, go.sum and ISO week so it is
      # saved again each week and its build output never ages far. Locally a
      # warm build cache took golangci-lint from 29 s to 9 s, both warm to 2 s.
      # TestGoLintKeepsItsOwnBuildCache keeps it (plans/ci-speed-463-464-443.md).
      - name: Set up Go
        id: go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true # the newest 1.26 patch, not the runner's cached one (stdlib advisories)
          cache: false

      - name: Lint cache week
        id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Restore the lint caches
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/golangci-lint
          key: go-lint-${{ runner.os }}-go${{ steps.go.outputs.go-version }}-${{ hashFiles('src/go.sum') }}-${{ steps.week.outputs.week }}
          restore-keys: |
            go-lint-${{ runner.os }}-go${{ steps.go.outputs.go-version }}-${{ hashFiles('src/go.sum') }}-
            go-lint-${{ runner.os }}-go${{ steps.go.outputs.go-version }}-

      # golangci-lint runs here without a config file, and gofmt is not in its
      # default linter set (errcheck, gosimple, govet, ineffassign, staticcheck,
      # unused). So nothing was checking formatting at all, which is how
      # cmd/sap-s4hana-producer/service.go sat unformatted on main until #236.
      # Cheap, and first, so a formatting nit fails in seconds.
      - name: Check gofmt
        working-directory: src
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::not gofmt-clean:"
            echo "$unformatted" | sed 's/^/  /'
            echo
            echo "Fix with:  gofmt -w $(echo $unformatted | tr '\n' ' ')"
            exit 1
          fi
          echo "all files are gofmt-clean"

      - name: Download Go modules
        uses: ./.github/actions/go-modules

      # v2, and the action must move to v8 with it. v1.64.8 was itself built
      # with Go 1.24 and refused to target 1.26 ("the Go language version used
      # to build golangci-lint is lower than the targeted Go version"), so the
      # toolchain bump forced this. Settings now live in src/.golangci.yml
      # rather than being whatever the pinned binary defaulted to.
      #
      # `cache: true` is gone: the action never accepted that input and logged
      # "Unexpected input(s) 'cache'" on every run. Its own cache is off
      # since #463 (skip-cache): the step above restores and saves
      # ~/.cache/golangci-lint with the build cache.
      - name: Run Go linter
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.2
          working-directory: src
          args: --timeout=5m
          skip-cache: true

      # #94: fail the build if a management-API route is served without an
      # OpenAPI registry entry (keeps /openapi.json complete).
      - name: Lint OpenAPI annotations
        working-directory: src
        env:
          GOPROXY: "off"
        run: go run ./cmd/lint-openapi

      # Fail the build if a query touches a tenant-scoped table without a
      # tenant_id filter (or an explained lint:tenant-ok). Covers the
      # management API and the remote-agent gateway, whose queries decide which
      # workspace an agent and its files belong to (#266).
      - name: Lint tenant filters
        working-directory: src
        run: make lint-tenant

      # Fail the build if an SDK connector never calls sdk.Run* or imports
      # pkg/messaging around the SDK (#98). `make lint` ran it but CI did not
      # until #462. Standard library only: about 2 s cold, 0.3 s warm.
      - name: Lint connectors
        working-directory: src
        run: make lint-connector

  # One "Go Tests" result for everything above, as before the split: green
  # only when every shard and both lint jobs passed. Branch protection does
  # not require it today; it keeps a single check to point at, and the plan
  # job needs it as well as the jobs themselves.
  go-tests:
    name: Go Tests
    needs: [go-test-shards, go-lint, alert-rules]
    if: always() && (github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.sha))
    runs-on: ubuntu-latest
    steps:
      - name: Every shard and both lint jobs passed
        env:
          SHARDS: ${{ needs.go-test-shards.result }}
          LINT: ${{ needs.go-lint.result }}
          RULES: ${{ needs.alert-rules.result }}
        # One check per line, each exiting itself: a `&&` chain fails the
        # step only while it is the last line (#443).
        # TestGoTestsAggregatorFailsWhenANeededJobDid runs this script.
        run: |
          echo "shards: $SHARDS, lint: $LINT, alert rules: $RULES"
          [ "$SHARDS" = success ] || exit 1
          [ "$LINT" = success ] || exit 1
          [ "$RULES" = success ] || exit 1

  # The remote agent (#266) runs on customer Windows machines. The Windows-only
  # code — the credential's ACL, atomic rename over a locked file, the service
  # install/start/stop, the Event Log — cannot be exercised on Linux, so it is
  # tested here on a real Windows runner. VRSKY_AGENT_SERVICE_TEST enables the
  # test that installs and starts a real service; the runner is disposable.
  agent-windows:
    name: Remote agent on Windows
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.sha)
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true # the newest 1.26 patch, not the runner's cached one (stdlib advisories)
          cache-dependency-path: src/go.sum
      - name: Download Go modules
        uses: ./.github/actions/go-modules
      - name: Test the agent (including a real service install)
        working-directory: src
        env:
          GOPROXY: "off"
          VRSKY_AGENT_SERVICE_TEST: "1"
        run: go test -count=1 -v ./pkg/agent/... ./pkg/agentproto/... ./cmd/vrsky-agent/...
      # The one-line installer Settings shows (pkg/managementapi/agent_install.ps1),
      # run offline: a local .exe instead of a download, no token, no service.
      # Proves the script parses under Windows PowerShell 5.1 on a real Windows,
      # writes a config the agent accepts, and that uninstall -Purge leaves
      # nothing behind. Registration and the service are covered by the Go
      # test above and by a manual run against a real VRSky.
      - name: Install script — offline install, check, uninstall
        shell: powershell
        working-directory: src
        env:
          GOPROXY: "off"
        run: |
          $ErrorActionPreference = 'Stop'
          go build -o bin\vrsky-agent-windows-amd64.exe .\cmd\vrsky-agent
          $install = [scriptblock]::Create((Get-Content -Raw pkg\managementapi\agent_install.ps1))
          & $install -Url https://vrsky.example -ExePath bin\vrsky-agent-windows-amd64.exe `
            -Inbox C:\VRSkyTest\inbox -Outbox C:\VRSkyTest\outbox -NoService
          if (-not (Test-Path 'C:\Program Files\VRSky\vrsky-agent.exe')) { throw 'agent not installed' }
          $cfg = Get-Content -Raw 'C:\ProgramData\VRSky\agent\config.json' | ConvertFrom-Json
          if ($cfg.directories.inbox.path -ne 'C:\VRSkyTest\inbox' -or $cfg.directories.outbox.mode -ne 'write') { throw "unexpected config: $cfg" }
          $check = & 'C:\Program Files\VRSky\vrsky-agent.exe' check | Out-String
          if ($check -notmatch 'Not registered yet') { throw "unexpected check output: $check" }
          # A second run must keep the config (upgrade path) and not ask questions.
          & $install -Url https://vrsky.example -ExePath bin\vrsky-agent-windows-amd64.exe -NoService
          if ((Get-Content -Raw 'C:\ProgramData\VRSky\agent\config.json') -notmatch 'VRSkyTest') { throw 'config was overwritten on re-run' }
          $uninstall = [scriptblock]::Create((Get-Content -Raw pkg\managementapi\agent_uninstall.ps1))
          & $uninstall -Purge
          if (Test-Path 'C:\Program Files\VRSky\vrsky-agent.exe') { throw 'agent still present after uninstall' }
          if (Test-Path 'C:\ProgramData\VRSky\agent') { throw 'data dir still present after -Purge' }

  # Downloadable agent binaries for every push and PR (Actions → the run →
  # Artifacts). Releases attaching them to tags are a follow-up.
  agent-binaries:
    name: Build remote agent binaries
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.sha)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # git describe for the version string
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true # the newest 1.26 patch, not the runner's cached one (stdlib advisories)
          cache-dependency-path: src/go.sum
      - name: Download Go modules
        uses: ./.github/actions/go-modules
      - name: Build
        working-directory: src
        env:
          GOPROXY: "off"
        run: make build-agent
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: vrsky-agent
          path: src/bin/vrsky-agent-*
          if-no-files-found: error

  # ---- Production rollout (plans/auto-deploy.md) ---------------------------
  # Merge to main → every test job green on that commit → the affected
  # images are built in ACR, one per runner → the affected deployments roll by
  # digest with the same scripts a human runs → smoke check. Serialised by
  # the `production` concurrency group. Authentication is OpenID Connect
  # federation (an Entra app trusts this repository's main branch); no
  # secret is stored. TestDeployJobGatesOnTests keeps the gates in place.
  plan:
    name: Plan the rollout
    needs: [changes, test, go-tests, go-test-shards, go-lint, alert-rules, agent-windows, agent-binaries]
    # `test` is skipped on a merge that did not touch the UI; a skipped gate
    # is fine, a failed or cancelled one is not.
    if: >-
      always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
      && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.plan.outputs.images }}
      core: ${{ steps.plan.outputs.core }}
      connectors: ${{ steps.plan.outputs.connectors }}
      connectors_manifest: ${{ steps.plan.outputs.connectors_manifest }}
      monitoring: ${{ steps.plan.outputs.monitoring }}
      backup: ${{ steps.plan.outputs.backup }}
      anything: ${{ steps.plan.outputs.anything }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      # affected.sh asks `go list` which images import a changed package
      # (#437). It needs the toolchain and the module cache, nothing more; if
      # `go list` fails anyway, affected.sh rebuilds every Go image.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: src/go.sum
      - name: Download Go modules
        uses: ./.github/actions/go-modules
      - name: Map the merge's paths to targets
        id: plan
        env:
          GOPROXY: "off"
        run: |
          # --no-renames lists both sides of a rename, so `git mv x.go
          # x_test.go` still counts the code that left the image (#410).
          git diff --name-only --no-renames HEAD^ HEAD > changed.txt
          infrastructure/azure/affected.sh < changed.txt > targets.txt
          echo "changed paths:"; sed 's/^/  /' changed.txt
          echo "targets:";       sed 's/^/  /' targets.txt
          echo "images=$(awk '$1=="image"{print $2}' targets.txt | jq -R . | jq -sc .)"           >> "$GITHUB_OUTPUT"
          echo "core=$(awk '$1=="core"{print $2}' targets.txt | tr '\n' ' ')"                      >> "$GITHUB_OUTPUT"
          echo "connectors=$(awk '$1=="connector"{print $2}' targets.txt | tr '\n' ' ')"           >> "$GITHUB_OUTPUT"
          echo "connectors_manifest=$(grep -qx connectors-manifest targets.txt && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "monitoring=$(grep -qx monitoring targets.txt && echo true || echo false)"           >> "$GITHUB_OUTPUT"
          echo "backup=$(grep -qx backup targets.txt && echo true || echo false)"                   >> "$GITHUB_OUTPUT"
          echo "anything=$([ -s targets.txt ] && echo true || echo false)"                          >> "$GITHUB_OUTPUT"

  build-images:
    name: Build ${{ matrix.image }} in ACR
    needs: plan
    # !cancelled(): without a status function GitHub prepends success(), which
    # looks at every ancestor job — and the UI test job is skipped on a merge
    # that did not touch the UI, which skipped this job on the first run
    # (2026-10-19) although the plan had 35 images for it.
    if: >-
      !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.images != '[]'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.plan.outputs.images) }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # git describe for AGENT_VERSION
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: az acr build (server-side; the runner only uploads the context)
        run: |
          set -euo pipefail
          img="${{ matrix.image }}"
          if [ "$img" = ui ]; then
            az acr build --registry vrskyprodacr --image "vrsky/ui:latest" --file ui/Dockerfile .
          else
            args=()
            # management-api ships the downloadable agent, stamped with the commit (build-push-acr.sh).
            [ "$img" = management-api ] && args=(--build-arg "AGENT_VERSION=$(git describe --always --dirty)")
            az acr build --registry vrskyprodacr --image "vrsky/${img}:latest" --file "src/cmd/${img}/Dockerfile" "${args[@]+"${args[@]}"}" .
          fi

  deploy:
    name: Deploy to production
    needs: [plan, build-images]
    if: >-
      always() && needs.plan.result == 'success' && needs.plan.outputs.anything == 'true'
      && needs.build-images.result != 'failure' && needs.build-images.result != 'cancelled'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    env:
      CORE: ${{ needs.plan.outputs.core }}
      CONNECTORS: ${{ needs.plan.outputs.connectors }}
      CONNECTORS_MANIFEST: ${{ needs.plan.outputs.connectors_manifest }}
      MONITORING: ${{ needs.plan.outputs.monitoring }}
      BACKUP: ${{ needs.plan.outputs.backup }}
      AKS_RESOURCE_GROUP: ${{ vars.AKS_RESOURCE_GROUP }}
    steps:
      - uses: actions/checkout@v5
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      # The cluster is parked (az aks stop) between working sessions
      # (docs/operator/cost-parking.md). A merge while it is stopped builds its
      # images and then deploys nothing — green, with a notice — and the
      # Catch up workflow brings production to main after the next start
      # (plans/deploy-while-parked.md).
      - name: Cluster power state
        id: cluster
        run: |
          state=$(az aks show -g "$AKS_RESOURCE_GROUP" -n vrsky-prod --query powerState.code -o tsv)
          echo "state=$state" >> "$GITHUB_OUTPUT"
          echo "cluster vrsky-prod is $state"
          if [ "$state" != Running ]; then
            echo "::notice title=Cluster is $state::Nothing deployed. The images for this merge are in the registry; after az aks start, run the Catch up workflow (Actions → Catch up → Run workflow)."
            {
              echo "## Cluster is $state — nothing deployed"
              echo
              echo "Waiting in the registry: \`${{ needs.plan.outputs.images }}\`"
              echo
              echo "After \`az aks start\`: Actions → **Catch up** → Run workflow."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      # The API server accepts connections from a few approved addresses only
      # and a runner is never one of them, so every kubectl and helm below runs
      # INSIDE the cluster through in-cluster.sh (az aks command invoke). The
      # files it needs are staged with their paths intact and uploaded whole.
      - name: Stage the deploy files
        if: steps.cluster.outputs.state == 'Running'
        run: |
          mkdir -p stage
          cp --parents -r infrastructure/azure infrastructure/kubernetes/connectors infrastructure/kubernetes/monitoring infrastructure/kubernetes/backup infrastructure/prometheus-rules.yml stage/
          for n in $CORE; do
            d=$(az acr repository show -n vrskyprodacr --image "vrsky/$n:latest" --query digest -o tsv)
            echo "$n $d" >> stage/digests.txt
          done
          [ -f stage/digests.txt ] && { echo "digests:"; sed 's/^/  /' stage/digests.txt; } || true
      # The backup Job and the UI pull with copies of vrsky-platform's
      # acr-pull. Refresh them on every deploy, before anything rolls, so the
      # first UI rollout after an ACR password rotation pulls with the new
      # password (#431, #497). Only those Secrets: the CronJob's suspend is
      # left alone. A no-op on a cluster without the source Secret.
      - name: Refresh the acr-pull copies in vrsky-database and vrsky-ui
        if: steps.cluster.outputs.state == 'Running'
        run: infrastructure/azure/in-cluster.sh stage "bash infrastructure/azure/copy-acr-pull.sh"
      - name: Roll core services by digest
        if: steps.cluster.outputs.state == 'Running' && env.CORE != ''
        run: infrastructure/azure/in-cluster.sh stage "DIGESTS_FILE=digests.txt bash infrastructure/azure/deploy-core-azure.sh $CORE"
      - name: Deploy the connector fleet (manifest changed)
        if: steps.cluster.outputs.state == 'Running' && env.CONNECTORS_MANIFEST == 'true'
        run: infrastructure/azure/in-cluster.sh stage "bash infrastructure/azure/deploy-connectors-azure.sh"
      - name: Restart the connectors whose image changed
        if: steps.cluster.outputs.state == 'Running' && env.CONNECTORS_MANIFEST != 'true' && env.CONNECTORS != ''
        run: |
          infrastructure/azure/in-cluster.sh stage "set -e; for c in $CONNECTORS; do kubectl rollout restart deploy/vrsky-\$c -n vrsky-platform; done; for c in $CONNECTORS; do kubectl rollout status deploy/vrsky-\$c -n vrsky-platform --timeout=240s; done"
      - name: Monitoring values and alert rules
        if: steps.cluster.outputs.state == 'Running' && env.MONITORING == 'true'
        run: infrastructure/azure/in-cluster.sh stage "PROFILE=azure bash infrastructure/kubernetes/monitoring/install-monitoring.sh"
      - name: Smoke check
        if: steps.cluster.outputs.state == 'Running'
        run: |
          consumers=""
          for c in $CONNECTORS; do case "$c" in *-consumer|remote-agent) consumers="$consumers vrsky-$c";; esac; done
          if [ "$CONNECTORS_MANIFEST" = true ]; then consumers="vrsky-webhook-consumer vrsky-business-central-consumer vrsky-remote-agent"; fi
          infrastructure/azure/in-cluster.sh stage "bash infrastructure/azure/smoke-prod.sh $consumers"
      # The management-DB backup CronJob (#395). Suspended until a human has
      # created vrsky-backup-config; the script never touches that Secret.
      # After the smoke check, so a failing apply can't hide its result.
      - name: Backup CronJob
        if: steps.cluster.outputs.state == 'Running' && env.BACKUP == 'true'
        run: infrastructure/azure/in-cluster.sh stage "bash infrastructure/azure/deploy-backup-azure.sh"
