# Production check: is the monitoring alive, and is production running what
# the registry has?
#
# Every half hour while the cluster runs. First the heartbeat: Prometheus
# must report the Watchdog firing and Alertmanager must hold it, or a dead
# monitoring stack would look exactly like "all is well"; a miss fails the
# run, and the CI failure alert opens the stateful issue
# (plans/monitoring-heartbeat.md). Then drift: the cluster is parked between
# working sessions, merges while it is stopped build their images and deploy
# nothing, and after `az aks start` production is behind until someone runs
# Catch up. The check reads the digest every container actually runs,
# compares it with the registry's :latest, and when anything differs
# dispatches Catch up itself — connectors included only when a connector
# drifted. It writes nothing else. A stopped cluster, or a build in progress
# on main (the deploy job will roll it in a minute), makes it exit green
# without looking (plans/digest-drift.md).
name: Production check

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  drift:
    name: Monitoring alive, production at main?
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
      actions: write
    env:
      AKS_RESOURCE_GROUP: ${{ vars.AKS_RESOURCE_GROUP }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Gate
        id: gate
        run: |
          state=$(az aks show -g "$AKS_RESOURCE_GROUP" -n vrsky-prod --query powerState.code -o tsv)
          building=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow build-push.yml --branch main --status in_progress --json databaseId -q length)
          echo "cluster $state, builds in progress on main: $building"
          if [ "$state" != Running ]; then
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Cluster is $state::Nothing to compare."
          elif [ "$building" != 0 ]; then
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Build in progress on main::The deploy job rolls it; checking again next time."
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Budget
        # The month's spend against vars.MONTHLY_BUDGET_NOK (plans/cost-cap.md).
        # At or above it the cluster is stopped and the run is red, so the
        # issue opens; a start afterwards lasts until the next run. Unset
        # variable: no check. A failed query fails the run and stops nothing.
        if: steps.gate.outputs.go == 'true' && vars.MONTHLY_BUDGET_NOK != ''
        env:
          MONTHLY_BUDGET_NOK: ${{ vars.MONTHLY_BUDGET_NOK }}
        run: |
          mtd=$(az rest --method post \
            --url "https://management.azure.com/subscriptions/${{ vars.AZURE_SUBSCRIPTION_ID }}/providers/Microsoft.CostManagement/query?api-version=2023-11-01" \
            --body '{"type":"ActualCost","timeframe":"MonthToDate","dataset":{"granularity":"None","aggregation":{"totalCost":{"name":"Cost","function":"Sum"}},"filter":{"dimensions":{"name":"ResourceGroupName","operator":"In","values":["vrsky-prod","MC_vrsky-prod_vrsky-prod_norwayeast"]}}}}' \
            --query 'properties.rows[0][0]' -o tsv 2>/dev/null || echo "query failed")
          [ -n "$mtd" ] || mtd=0   # no rows yet this month
          set +e
          line=$(infrastructure/azure/budget.sh "$mtd" "$MONTHLY_BUDGET_NOK" 2>&1); code=$?
          set -e
          echo "$line"
          case $code in
            0) echo "$line" >> "$GITHUB_STEP_SUMMARY" ;;
            3) az aks stop -g "$AKS_RESOURCE_GROUP" -n vrsky-prod
               echo "::error title=Monthly budget reached::$line. The cluster has been stopped; it will be stopped again on every run this month."
               { echo "## Monthly budget reached"; echo; echo "$line"; echo; echo "The cluster has been stopped and stays parked until next month (or a higher MONTHLY_BUDGET_NOK)."; } >> "$GITHUB_STEP_SUMMARY"
               exit 1 ;;
            *) echo "::error title=Budget check failed::$line. Nothing was stopped; does the deploy identity hold Cost Management Reader on the resource groups?"
               exit 1 ;;
          esac
      - name: Stage
        if: steps.gate.outputs.go == 'true'
        run: mkdir -p stage && cp --parents infrastructure/azure/running-digests.sh infrastructure/azure/monitoring-alive.sh stage/
      - name: Monitoring alive
        id: alive
        if: steps.gate.outputs.go == 'true'
        # The drift comparison below still runs when this fails; the verdict
        # step at the end turns the miss into a red run.
        continue-on-error: true
        run: infrastructure/azure/in-cluster.sh stage "bash infrastructure/azure/monitoring-alive.sh"
      - name: Running digests
        if: steps.gate.outputs.go == 'true'
        run: infrastructure/azure/in-cluster.sh stage "bash infrastructure/azure/running-digests.sh" > running.txt && cat running.txt
      - name: Registry digests
        if: steps.gate.outputs.go == 'true'
        run: |
          for repo in $(az acr repository list -n vrskyprodacr -o tsv | grep '^vrsky/'); do
            d=$(az acr repository show-tags -n vrskyprodacr --repository "$repo" --detail --query "[?name=='latest'].digest | [0]" -o tsv)
            [ -n "$d" ] && echo "${repo#vrsky/} $d" >> latest.txt
          done
          cat latest.txt
      - name: Compare
        if: steps.gate.outputs.go == 'true'
        run: |
          infrastructure/azure/drift.sh running.txt latest.txt > drift.txt
          if [ ! -s drift.txt ]; then
            echo "production is at main ($(wc -l < running.txt) running digests checked)"
            exit 0
          fi
          connectors=false
          while read -r name _; do
            case " management-api ui data-filter data-converter alert-responder " in
              *" $name "*) ;;
              *) connectors=true ;;
            esac
          done < drift.txt
          {
            echo "## Production is behind main"; echo
            echo "| service | running | registry |"; echo "|---|---|---|"
            awk '{printf "| %s | %s | %s |\n", $1, substr($2, 8, 12), (substr($3, 1, 7) == "sha256:" ? substr($3, 8, 12) : $3)}' drift.txt
            echo; echo "Catch up dispatched (connectors: $connectors)."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Production is behind main::$(wc -l < drift.txt) service(s) drifted; Catch up dispatched (connectors: $connectors)."
          gh workflow run catch-up.yml --repo "$GITHUB_REPOSITORY" --ref main -f connectors="$connectors"
      - name: Monitoring verdict
        if: steps.gate.outputs.go == 'true' && steps.alive.outcome == 'failure'
        run: |
          echo "::error title=Monitoring is not alive::Prometheus or Alertmanager is not reporting the Watchdog; see the Monitoring alive step."
          exit 1
