# Park: the cluster does not run outside working hours.
#
# The node costs about 107 NOK a day while it runs and nothing while it is
# stopped (plans/cost-cap.md). A start is by hand (az aks start) and the
# Production check catches production up; a stop that nobody remembered is
# what this is for. GitHub runs schedules late, on this repository by hours
# (2026-10-20: the 14:00 and 15:00 UTC crons ran at 18:10 and 18:53), so
# this is not "at 16:00" but "any run that lands between 16:00 and 07:00
# Europe/Oslo stops a Running cluster", with a cron every half hour through
# that window so that enough of them land. The crons sit at :07 and :37, off
# the round minutes where GitHub's scheduler is busiest and delays or drops
# runs (2026-10-21: every :00/:30 run from 16:00 to 20:00 Oslo was dropped,
# the first one arrived at 20:19). A start in the evening is
# stopped again by the next run; dispatch stops it at any hour (a stop from
# the phone). It queues behind a deploy or a catch-up on the production
# group and never interrupts one.
name: Park

on:
  schedule:
    - cron: "7,37 14-23 * * *" # 16:00 Oslo (14:00 UTC in summer, 15:00 in winter) to midnight UTC
    - cron: "7,37 0-5 * * *" # midnight UTC to 07:00 Oslo
  workflow_dispatch:

jobs:
  park:
    name: Stop the cluster outside working hours
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    env:
      AKS_RESOURCE_GROUP: ${{ vars.AKS_RESOURCE_GROUP }}
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Outside working hours in Oslo?
        id: clock
        run: |
          hour=$(TZ=Europe/Oslo date +%H)
          hour=$((10#$hour))
          echo "Oslo hour: $hour, event: ${{ github.event_name }}"
          if [ "${{ github.event_name }}" = workflow_dispatch ] || [ "$hour" -ge 16 ] || [ "$hour" -lt 7 ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Working hours in Oslo::Between 07:00 and 16:00 the cluster may run; nothing to do."
          fi
      - name: Stop the cluster
        if: steps.clock.outputs.go == 'true'
        run: |
          state=$(az aks show -g "$AKS_RESOURCE_GROUP" -n vrsky-prod --query powerState.code -o tsv)
          if [ "$state" = Running ]; then
            az aks stop -g "$AKS_RESOURCE_GROUP" -n vrsky-prod
            echo "## Cluster stopped at $(TZ=Europe/Oslo date '+%H:%M %Z')" >> "$GITHUB_STEP_SUMMARY"
            echo "To start it again: the Start section of docs/operator/cost-parking.md." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "cluster is already $state"
            echo "## Cluster was already $state" >> "$GITHUB_STEP_SUMMARY"
          fi
