name: docs

# Builds the mkdocs site from docs/ on every PR (strict — broken links/nav fail
# the build) and publishes it to GitHub Pages on push to main (#94).
#
# #451: the published site must stay reachable, since the UI's "Help & Docs"
# link opens it. After a deploy, and once a day, `published` fetches the site
# URL and fails the run if it is not 200. A red run on main opens the CI
# failure issue (ci-failure-alert.yml already watches "docs").

on:
  push:
    branches: [main]
    paths: ['docs/**', 'mkdocs.yml', '.github/workflows/docs.yml']
  pull_request:
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
      - 'scripts/check-docs-url*.sh'
      - 'ui/src/config/env.ts'
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Runs on every event, the daily schedule and manual dispatch included: a
    # run that skipped it would end green on the stale site although the docs
    # no longer build, and ci-failure-alert.yml would close "CI red on main:
    # docs" with the build still broken.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install mkdocs
        run: pip install mkdocs-material
      - name: Build site (strict)
        run: mkdocs build --strict
      - name: Docs URL is the same in mkdocs.yml and the UI (offline)
        run: |
          scripts/check-docs-url_test.sh
          scripts/check-docs-url.sh --offline

  deploy:
    # Publish to GitHub Pages only from main.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install mkdocs-material
      - name: Deploy to gh-pages
        run: mkdocs gh-deploy --force

  published:
    # The site answers 200 at its public URL. Runs after a deploy (Pages needs
    # a minute or two, the script retries), daily, and on demand. `always()`
    # keeps it going on schedule and dispatch, where `deploy` is skipped; it
    # still requires `build` to have passed, so a broken build fails the run.
    #
    # After a deploy, a 200 proves the URL is reachable, not that the new
    # content is live: Pages may still serve the previous version. The check
    # is for "the site exists" (#451), not "the latest deploy has propagated".
    if: >-
      always() && needs.build.result == 'success' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && needs.deploy.result == 'success'))
    needs: [build, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the docs site
        env:
          DOCS_URL_ATTEMPTS: '20'  # 20 x 15 s, about 5 min
        run: scripts/check-docs-url.sh
