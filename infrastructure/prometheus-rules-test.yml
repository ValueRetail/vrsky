# promtool unit tests for the VRSky default alert ruleset (#84).
# Run: docker run --rm -v "$PWD/infrastructure":/cfg --entrypoint promtool \
#        prom/prometheus:latest test rules /cfg/prometheus-rules-test.yml
# All 9 rules are driven to FIRING — the "staged test" acceptance
# criterion, deterministic and CI-runnable.

rule_files:
  - prometheus-rules.yml

evaluation_interval: 1m

tests:
  # 1. PipelineDown -- a polled source publishes once per 30-minute poll for
  #    six hours, then goes silent. A webhook source with the same shape must
  #    never fire: its silence is the sender's.
  - interval: 1m
    input_series:
      - series: 'vrsky_messages_published_total{tenant_id="t1",connection_id="c1",connector="vrsky-business-central-consumer"}'
        values: '0x29 1x29 2x29 3x29 4x29 5x29 6x29 7x29 8x29 9x29 10x29 11x29 12x120'
      - series: 'vrsky_messages_published_total{tenant_id="t1",connection_id="c2",connector="vrsky-webhook-consumer"}'
        values: '0x29 1x29 2x29 3x29 4x29 5x29 6x29 7x29 8x29 9x29 10x29 11x29 12x120'
    alert_rule_test:
      # Still polling: one message every 30 minutes is not an outage (the old
      # 5-minute rate window fired at this point).
      - eval_time: 200m
        alertname: PipelineDown
        exp_alerts: []
      - eval_time: 359m
        alertname: PipelineDown
        exp_alerts: []
      # An hour of silence (plus "for") after the last poll at minute 360.
      - eval_time: 440m
        alertname: PipelineDown
        exp_alerts:
          - exp_labels:
              alertname: PipelineDown
              severity: critical
              tenant_id: t1
              connection_id: c1
            exp_annotations:
              summary: "pipeline c1 has published nothing for an hour (tenant t1)"
              description: "A polled source for tenant t1 published during the previous six hours and nothing in the last hour. Check the pipeline's events and the source's credentials."

  # 2. DLQGrowing — dead-lettered messages start arriving at minute 10.
  - interval: 1m
    input_series:
      - series: 'vrsky_dlq_messages_total{pipeline_id="p1",worker="db-producer"}'
        values: '0x10 0+1x20' # flat, then +1/min from minute 10
    alert_rule_test:
      - eval_time: 25m
        alertname: DLQGrowing
        exp_alerts:
          - exp_labels:
              alertname: DLQGrowing
              severity: warning
              pipeline_id: p1
            exp_annotations:
              summary: "DLQ growing for pipeline p1"
              description: "Messages moved to the dead-letter queue in the last 10 minutes — a producer is repeatedly failing to deliver."
      - eval_time: 5m
        alertname: DLQGrowing
        exp_alerts: []

  # 3. JetStreamLagHigh — consumer backlog sits above the threshold.
  - interval: 1m
    input_series:
      - series: 'jetstream_consumer_num_pending{stream_name="VRSKY_DATA",consumer_name="db-producer"}'
        values: '2000x30'
    alert_rule_test:
      - eval_time: 15m
        alertname: JetStreamLagHigh
        exp_alerts:
          - exp_labels:
              alertname: JetStreamLagHigh
              severity: warning
              stream_name: VRSKY_DATA
              consumer_name: db-producer
            exp_annotations:
              summary: "JetStream consumer db-producer lag above 1000"
              description: "Pending (undelivered) messages for the consumer exceeded 1000 for 10 minutes — the worker is falling behind or down."

  # 4. CertExpirySoon — cert expires ~7 days from t=0 (< 14-day threshold).
  - interval: 1m
    input_series:
      - series: 'vrsky_tls_cert_expiry_timestamp_seconds{path="/certs/tls.crt"}'
        values: '604800x180' # NotAfter = 7 days (in seconds), constant
    alert_rule_test:
      - eval_time: 90m
        alertname: CertExpirySoon
        exp_alerts:
          - exp_labels:
              alertname: CertExpirySoon
              severity: warning
              path: /certs/tls.crt
            exp_annotations:
              summary: "TLS certificate /certs/tls.crt expires in under 14 days"
              description: "Renew the certificate at /certs/tls.crt before it expires."

  # 5. MgmtAPIErrorRate — half of all requests are 500s (50% > 5%).
  - interval: 1m
    input_series:
      - series: 'vrsky_mgmtapi_http_requests_total{method="GET",path="/api/v1/connections",status="500"}'
        values: '0+10x30'
      - series: 'vrsky_mgmtapi_http_requests_total{method="GET",path="/api/v1/connections",status="200"}'
        values: '0+10x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: MgmtAPIErrorRate
        exp_alerts:
          - exp_labels:
              alertname: MgmtAPIErrorRate
              severity: critical
            exp_annotations:
              summary: "management-api 5xx error rate above 5%"
              description: "More than 5% of management API requests returned a server error over the last 5 minutes."

  # 6. DiskUsageHigh — 90% full filesystem.
  - interval: 1m
    input_series:
      - series: 'node_filesystem_avail_bytes{fstype="ext4",mountpoint="/",device="/dev/sda1"}'
        values: '10x30'
      - series: 'node_filesystem_size_bytes{fstype="ext4",mountpoint="/",device="/dev/sda1"}'
        values: '100x30'
    alert_rule_test:
      - eval_time: 15m
        alertname: DiskUsageHigh
        exp_alerts:
          - exp_labels:
              alertname: DiskUsageHigh
              severity: warning
              fstype: ext4
              mountpoint: /
              device: /dev/sda1
            exp_annotations:
              summary: "disk usage above 80% on /"
              description: "Filesystem / (/dev/sda1) is over 80% full."

  # 7. ConnectionInError — a pipeline sits in error; a recovered one resolves.
  - interval: 1m
    input_series:
      - series: 'vrsky_connections{tenant_id="t1",status="error"}'
        values: '1x15 0x15'
      - series: 'vrsky_connections{tenant_id="t1",status="running"}'
        values: '3x30'
      - series: 'vrsky_connections{tenant_id="t2",status="error"}'
        values: '0x30'
    alert_rule_test:
      - eval_time: 12m
        alertname: ConnectionInError
        exp_alerts:
          - exp_labels:
              alertname: ConnectionInError
              severity: critical
              tenant_id: t1
            exp_annotations:
              summary: "1 pipeline(s) in error for workspace t1"
              description: "At least one deployed pipeline has been in status error for 10 minutes. Open the builder's pipeline log for the reason, fix the configuration and redeploy."
      # Under the 10-minute hold: nothing yet.
      - eval_time: 5m
        alertname: ConnectionInError
        exp_alerts: []
      # Fixed and redeployed: resolved.
      - eval_time: 28m
        alertname: ConnectionInError
        exp_alerts: []

  # 8. RemoteAgentOffline — a till stops polling; another stays online.
  - interval: 1m
    input_series:
      - series: 'vrsky_remote_agent_online{tenant_id="t1",agent_id="a1",agent="POS-PC"}'
        values: '0x90'
      - series: 'vrsky_remote_agent_online{tenant_id="t1",agent_id="a2",agent="TILL-2"}'
        values: '1x90'
    alert_rule_test:
      - eval_time: 75m
        alertname: RemoteAgentOffline
        exp_alerts:
          - exp_labels:
              alertname: RemoteAgentOffline
              severity: warning
              tenant_id: t1
              agent_id: a1
              agent: POS-PC
            exp_annotations:
              summary: "remote agent POS-PC offline for over 1 hour"
              description: "Agent POS-PC in workspace t1 has not polled VRSky for an hour. Its pipelines hold data for up to 72 hours. Check the machine, the VRSkyAgent service and its network."
      # A short outage (under an hour) does not alert.
      - eval_time: 30m
        alertname: RemoteAgentOffline
        exp_alerts: []

  # 9. ConnectorUnavailable — a connector Deployment has no replica. One
  #    scaled to 0 on purpose (the parked alert responder) must stay silent.
  - interval: 1m
    input_series:
      - series: 'kube_deployment_status_replicas_available{namespace="vrsky-platform",deployment="vrsky-business-central-consumer"}'
        values: '0x30'
      - series: 'kube_deployment_spec_replicas{namespace="vrsky-platform",deployment="vrsky-business-central-consumer"}'
        values: '1x30'
      - series: 'kube_deployment_status_replicas_available{namespace="vrsky-platform",deployment="vrsky-remote-agent"}'
        values: '1x30'
      - series: 'kube_deployment_spec_replicas{namespace="vrsky-platform",deployment="vrsky-remote-agent"}'
        values: '1x30'
      - series: 'kube_deployment_status_replicas_available{namespace="vrsky-platform",deployment="vrsky-alert-responder"}'
        values: '0x30'
      - series: 'kube_deployment_spec_replicas{namespace="vrsky-platform",deployment="vrsky-alert-responder"}'
        values: '0x30'
      - series: 'kube_deployment_status_replicas_available{namespace="kube-system",deployment="coredns"}'
        values: '0x30'
      - series: 'kube_deployment_spec_replicas{namespace="kube-system",deployment="coredns"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 15m
        alertname: ConnectorUnavailable
        exp_alerts:
          - exp_labels:
              alertname: ConnectorUnavailable
              severity: critical
              namespace: vrsky-platform
              deployment: vrsky-business-central-consumer
            exp_annotations:
              summary: "vrsky-business-central-consumer has no running replica"
              description: "Deployment vrsky-business-central-consumer in vrsky-platform has had 0 available replicas for 10 minutes. Every pipeline using that connector is stalled."
