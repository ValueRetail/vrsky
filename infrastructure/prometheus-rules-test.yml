# promtool unit tests for the VRSky default alert ruleset (#84).
# Run: docker run --rm -v "$PWD/infrastructure":/cfg --entrypoint promtool \
#        prom/prometheus:latest test rules /cfg/prometheus-rules-test.yml
# 11 of the 12 rules are driven to FIRING (all but
# NATSInstanceApproachingCapacity) — the "staged test" acceptance criterion,
# deterministic and CI-runnable.

rule_files:
  - prometheus-rules.yml

evaluation_interval: 1m

tests:
  # 1. PipelineDown -- a polled source publishes once per 30-minute poll for
  #    six hours, then goes silent. A webhook source with the same shape must
  #    never fire: its silence is the sender's. This group runs at the real
  #    30 s scrape interval because the rule counts samples.
  - name: pipeline-down-polled
    interval: 30s
    input_series:
      - series: 'vrsky_messages_published_total{tenant_id="t1",connection_id="c1",connector="vrsky-business-central-consumer"}'
        values: '0x59 1x59 2x59 3x59 4x59 5x59 6x59 7x59 8x59 9x59 10x59 11x59 12x240'
      - series: 'vrsky_messages_published_total{tenant_id="t1",connection_id="c2",connector="vrsky-webhook-consumer"}'
        values: '0x59 1x59 2x59 3x59 4x59 5x59 6x59 7x59 8x59 9x59 10x59 11x59 12x240'
    alert_rule_test:
      # Still polling: one message every 30 minutes is not an outage (the old
      # 5-minute rate window fired at this point).
      - eval_time: 200m
        alertname: PipelineDown
        exp_alerts: []
      - eval_time: 359m
        alertname: PipelineDown
        exp_alerts: []
      # An hour of silence (plus "for") after the last poll at minute 360.
      - eval_time: 440m
        alertname: PipelineDown
        exp_alerts:
          - exp_labels:
              alertname: PipelineDown
              severity: critical
              tenant_id: t1
              connection_id: c1
            exp_annotations:
              summary: "pipeline c1 has published nothing for an hour (tenant t1)"
              description: "A polled source for tenant t1 published during the previous six hours and nothing in the last hour. Check the pipeline's events and the source's credentials."

  # 1b. PipelineDown after a parked cluster: three hours of polling, a
  #     three-hour stop with no samples at all (minutes 180-360), then the
  #     connector restarts with its counter at 0 and finds nothing new. The
  #     pre-stop publishes still sit in the 6h-offset-1h window, so without
  #     the sample-count clause this fired five minutes after the start
  #     (2026-10-19). An hour after the start the history is complete again
  #     and a source that is still silent pages as it would any other time.
  - name: pipeline-down-after-park
    interval: 30s
    input_series:
      - series: 'vrsky_messages_published_total{tenant_id="t1",connection_id="c1",connector="vrsky-business-central-consumer"}'
        values: '0x59 1x59 2x59 3x59 4x59 5x59 _x360 0x180'
    alert_rule_test:
      - eval_time: 370m
        alertname: PipelineDown
        exp_alerts: []
      - eval_time: 410m
        alertname: PipelineDown
        exp_alerts: []
      - eval_time: 430m
        alertname: PipelineDown
        exp_alerts:
          - exp_labels:
              alertname: PipelineDown
              severity: critical
              tenant_id: t1
              connection_id: c1
            exp_annotations:
              summary: "pipeline c1 has published nothing for an hour (tenant t1)"
              description: "A polled source for tenant t1 published during the previous six hours and nothing in the last hour. Check the pipeline's events and the source's credentials."

  # 2. DLQGrowing — dead-lettered messages start arriving at minute 10.
  - name: dlq-growing
    interval: 1m
    input_series:
      - series: 'vrsky_dlq_messages_total{pipeline_id="p1",worker="db-producer"}'
        values: '0x10 0+1x20' # flat, then +1/min from minute 10
    alert_rule_test:
      - eval_time: 25m
        alertname: DLQGrowing
        exp_alerts:
          - exp_labels:
              alertname: DLQGrowing
              severity: warning
              pipeline_id: p1
            exp_annotations:
              summary: "DLQ growing for pipeline p1"
              description: "Messages moved to the dead-letter queue in the last 10 minutes — a producer is repeatedly failing to deliver."
      - eval_time: 5m
        alertname: DLQGrowing
        exp_alerts: []

  # 3. JetStreamLagHigh — consumer backlog sits above the threshold.
  - name: jetstream-lag-high
    interval: 1m
    input_series:
      - series: 'jetstream_consumer_num_pending{stream_name="VRSKY_DATA",consumer_name="db-producer"}'
        values: '2000x30'
    alert_rule_test:
      - eval_time: 15m
        alertname: JetStreamLagHigh
        exp_alerts:
          - exp_labels:
              alertname: JetStreamLagHigh
              severity: warning
              stream_name: VRSKY_DATA
              consumer_name: db-producer
            exp_annotations:
              summary: "JetStream consumer db-producer lag above 1000"
              description: "Pending (undelivered) messages for the consumer exceeded 1000 for 10 minutes — the worker is falling behind or down."

  # 4. CertExpirySoon — cert expires ~7 days from t=0 (< 14-day threshold).
  - name: cert-expiry-soon
    interval: 1m
    input_series:
      - series: 'vrsky_tls_cert_expiry_timestamp_seconds{path="/certs/tls.crt"}'
        values: '604800x180' # NotAfter = 7 days (in seconds), constant
    alert_rule_test:
      - eval_time: 90m
        alertname: CertExpirySoon
        exp_alerts:
          - exp_labels:
              alertname: CertExpirySoon
              severity: warning
              path: /certs/tls.crt
            exp_annotations:
              summary: "TLS certificate /certs/tls.crt expires in under 14 days"
              description: "Renew the certificate at /certs/tls.crt before it expires."

  # 5. MgmtAPIErrorRate — half of all requests are 500s (50% > 5%).
  - name: mgmt-api-error-rate
    interval: 1m
    input_series:
      - series: 'vrsky_mgmtapi_http_requests_total{method="GET",path="/api/v1/connections",status="500"}'
        values: '0+10x30'
      - series: 'vrsky_mgmtapi_http_requests_total{method="GET",path="/api/v1/connections",status="200"}'
        values: '0+10x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: MgmtAPIErrorRate
        exp_alerts:
          - exp_labels:
              alertname: MgmtAPIErrorRate
              severity: critical
            exp_annotations:
              summary: "management-api 5xx error rate above 5%"
              description: "More than 5% of management API requests returned a server error over the last 5 minutes."

  # 6. DiskUsageHigh — 90% full filesystem.
  - name: disk-usage-high
    interval: 1m
    input_series:
      - series: 'node_filesystem_avail_bytes{fstype="ext4",mountpoint="/",device="/dev/sda1"}'
        values: '10x30'
      - series: 'node_filesystem_size_bytes{fstype="ext4",mountpoint="/",device="/dev/sda1"}'
        values: '100x30'
    alert_rule_test:
      - eval_time: 15m
        alertname: DiskUsageHigh
        exp_alerts:
          - exp_labels:
              alertname: DiskUsageHigh
              severity: warning
              fstype: ext4
              mountpoint: /
              device: /dev/sda1
            exp_annotations:
              summary: "disk usage above 80% on /"
              description: "Filesystem / (/dev/sda1) is over 80% full."

  # 7. ConnectionInError — a pipeline sits in error; a recovered one resolves.
  - name: connection-in-error
    interval: 1m
    input_series:
      - series: 'vrsky_connections{tenant_id="t1",status="error"}'
        values: '1x15 0x15'
      - series: 'vrsky_connections{tenant_id="t1",status="running"}'
        values: '3x30'
      - series: 'vrsky_connections{tenant_id="t2",status="error"}'
        values: '0x30'
    alert_rule_test:
      - eval_time: 12m
        alertname: ConnectionInError
        exp_alerts:
          - exp_labels:
              alertname: ConnectionInError
              severity: critical
              tenant_id: t1
            exp_annotations:
              summary: "1 pipeline(s) in error for workspace t1"
              description: "At least one deployed pipeline has been in status error for 10 minutes. Open the builder's pipeline log for the reason, fix the configuration and redeploy."
      # Under the 10-minute hold: nothing yet.
      - eval_time: 5m
        alertname: ConnectionInError
        exp_alerts: []
      # Fixed and redeployed: resolved.
      - eval_time: 28m
        alertname: ConnectionInError
        exp_alerts: []

  # 8. RemoteAgentOffline — a till stops polling; another stays online.
  - name: remote-agent-offline
    interval: 1m
    input_series:
      - series: 'vrsky_remote_agent_online{tenant_id="t1",agent_id="a1",agent="POS-PC"}'
        values: '0x90'
      - series: 'vrsky_remote_agent_online{tenant_id="t1",agent_id="a2",agent="TILL-2"}'
        values: '1x90'
    alert_rule_test:
      - eval_time: 75m
        alertname: RemoteAgentOffline
        exp_alerts:
          - exp_labels:
              alertname: RemoteAgentOffline
              severity: warning
              tenant_id: t1
              agent_id: a1
              agent: POS-PC
            exp_annotations:
              summary: "remote agent POS-PC offline for over 1 hour"
              description: "Agent POS-PC in workspace t1 has not polled VRSky for an hour. Its pipelines hold data for up to 72 hours. Check the machine, the VRSkyAgent service and its network."
      # A short outage (under an hour) does not alert.
      - eval_time: 30m
        alertname: RemoteAgentOffline
        exp_alerts: []

  # 9. ConnectorUnavailable — a connector Deployment has no replica. One
  #    scaled to 0 on purpose (the parked alert responder) must stay silent.
  - name: connector-unavailable
    interval: 1m
    input_series:
      - series: 'kube_deployment_status_replicas_available{namespace="vrsky-platform",deployment="vrsky-business-central-consumer"}'
        values: '0x30'
      - series: 'kube_deployment_spec_replicas{namespace="vrsky-platform",deployment="vrsky-business-central-consumer"}'
        values: '1x30'
      - series: 'kube_deployment_status_replicas_available{namespace="vrsky-platform",deployment="vrsky-remote-agent"}'
        values: '1x30'
      - series: 'kube_deployment_spec_replicas{namespace="vrsky-platform",deployment="vrsky-remote-agent"}'
        values: '1x30'
      - series: 'kube_deployment_status_replicas_available{namespace="vrsky-platform",deployment="vrsky-alert-responder"}'
        values: '0x30'
      - series: 'kube_deployment_spec_replicas{namespace="vrsky-platform",deployment="vrsky-alert-responder"}'
        values: '0x30'
      - series: 'kube_deployment_status_replicas_available{namespace="kube-system",deployment="coredns"}'
        values: '0x30'
      - series: 'kube_deployment_spec_replicas{namespace="kube-system",deployment="coredns"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 15m
        alertname: ConnectorUnavailable
        exp_alerts:
          - exp_labels:
              alertname: ConnectorUnavailable
              severity: critical
              namespace: vrsky-platform
              deployment: vrsky-business-central-consumer
            exp_annotations:
              summary: "vrsky-business-central-consumer has no running replica"
              description: "Deployment vrsky-business-central-consumer in vrsky-platform has had 0 available replicas for 10 minutes. Every pipeline using that connector is stalled."

  # 10. NodeCPURequestsHigh — a node at 90% reserved for an hour fires; one
  #     at 70% does not; the 90% node is still pending at 30 minutes. n2 is
  #     the 2026-10-22 case: 50% held by a running pod plus 50% in finished
  #     pods (Succeeded, Failed) that hold nothing — it must not fire.
  - name: node-cpu-requests-high
    interval: 1m
    input_series:
      - series: 'kube_pod_container_resource_requests{resource="cpu",unit="core",node="n0",namespace="a",pod="p1",container="c"}'
        values: '2x90'
      - series: 'kube_pod_container_resource_requests{resource="cpu",unit="core",node="n0",namespace="b",pod="p2",container="c"}'
        values: '1.6x90'
      - series: 'kube_node_status_allocatable{resource="cpu",unit="core",node="n0"}'
        values: '4x90'
      - series: 'kube_pod_container_resource_requests{resource="cpu",unit="core",node="n1",namespace="a",pod="p3",container="c"}'
        values: '2.8x90'
      - series: 'kube_node_status_allocatable{resource="cpu",unit="core",node="n1"}'
        values: '4x90'
      - series: 'kube_pod_status_phase{namespace="a",pod="p1",phase="Running"}'
        values: '1x90'
      - series: 'kube_pod_status_phase{namespace="b",pod="p2",phase="Pending"}'
        values: '1x90'
      - series: 'kube_pod_status_phase{namespace="a",pod="p3",phase="Running"}'
        values: '1x90'
      - series: 'kube_pod_container_resource_requests{resource="cpu",unit="core",node="n2",namespace="a",pod="p4",container="c"}'
        values: '2x90'
      - series: 'kube_pod_status_phase{namespace="a",pod="p4",phase="Running"}'
        values: '1x90'
      - series: 'kube_pod_container_resource_requests{resource="cpu",unit="core",node="n2",namespace="aks-command",pod="cmd1",container="c"}'
        values: '1.2x90'
      - series: 'kube_pod_status_phase{namespace="aks-command",pod="cmd1",phase="Succeeded"}'
        values: '1x90'
      - series: 'kube_pod_status_phase{namespace="aks-command",pod="cmd1",phase="Running"}'
        values: '0x90'
      - series: 'kube_pod_container_resource_requests{resource="cpu",unit="core",node="n2",namespace="kube-system",pod="eraser1",container="c"}'
        values: '0.8x90'
      - series: 'kube_pod_status_phase{namespace="kube-system",pod="eraser1",phase="Failed"}'
        values: '1x90'
      - series: 'kube_node_status_allocatable{resource="cpu",unit="core",node="n2"}'
        values: '4x90'
    alert_rule_test:
      - eval_time: 30m
        alertname: NodeCPURequestsHigh
        exp_alerts: []
      - eval_time: 70m
        alertname: NodeCPURequestsHigh
        exp_alerts:
          - exp_labels:
              alertname: NodeCPURequestsHigh
              severity: warning
              node: n0
            exp_annotations:
              summary: "node n0 has 90% of its CPU reserved"
              description: "CPU requests on n0 have exceeded 85% of allocatable for an hour. Right-size requests (plans/cpu-request-headroom.md) before adding a node; usage is usually a fraction of this."

  # 11. MgmtBackupMissing (a) — failed backup Jobs since the last success.
  #     The clock starts at Thursday 00:00 UTC; every eval here is Thursday
  #     morning, and the last schedule time stays fresh, so only the
  #     failed-Job branch can fire. Jobs: a success at minute 10 (done at
  #     20), a failure started at 60 (failed at 70), a failure started at
  #     180 (failed at 190), then a success started at 300 (done at 310).
  #     KSM emits kube_job_status_completion_time only for a Job that
  #     succeeded and kube_job_failed only once the Job has a Failed
  #     condition.
  - name: backup-a-two-failures
    interval: 1m
    input_series:
      - series: 'kube_cronjob_spec_suspend{job="kube-state-metrics",namespace="vrsky-database",cronjob="vrsky-mgmt-backup"}'
        values: '0x340'
      - series: 'kube_cronjob_created{job="kube-state-metrics",namespace="vrsky-database",cronjob="vrsky-mgmt-backup"}'
        values: '60x340'
      - series: 'kube_cronjob_status_last_schedule_time{job="kube-state-metrics",namespace="vrsky-database",cronjob="vrsky-mgmt-backup"}'
        values: '_x10 600x49 3600x119 10800x119 18000x40'
      # success, minute 10-20
      - series: 'kube_job_owner{job="kube-state-metrics",namespace="vrsky-database",job_name="vrsky-mgmt-backup-10",owner_kind="CronJob",owner_name="vrsky-mgmt-backup",owner_is_controller="true"}'
        values: '_x10 1x330'
      - series: 'kube_job_status_start_time{job="kube-state-metrics",namespace="vrsky-database",job_name="vrsky-mgmt-backup-10"}'
        values: '_x10 600x330'
      - series: 'kube_job_status_completion_time{job="kube-state-metrics",namespace="vrsky-database",job_name="vrsky-mgmt-backup-10"}'
        values: '_x20 1200x320'
      # failure, minute 60-70
      - series: 'kube_job_owner{job="kube-state-metrics",namespace="vrsky-database",job_name="vrsky-mgmt-backup-60",owner_kind="CronJob",owner_name="vrsky-mgmt-backup",owner_is_controller="true"}'
        values: '_x60 1x280'
      - series: 'kube_job_status_start_time{job="kube-state-metrics",namespace="vrsky-database",job_name="vrsky-mgmt-backup-60"}'
        values: '_x60 3600x280'
      - series: 'kube_job_failed{job="kube-state-metrics",namespace="vrsky-database",job_name="vrsky-mgmt-backup-60",condition="true"}'
        values: '_x70 1x270'
      - series: 'kube_job_failed{job="kube-state-metrics",namespace="vrsky-database",job_name="vrsky-mgmt-backup-60",condition="false"}'
        values: '_x70 0x270'
      # failure, minute 180-190
      - series: 'kube_job_owner{job="kube-state-metrics",namespace="vrsky-database",job_name="vrsky-mgmt-backup-180",owner_kind="CronJob",owner_name="vrsky-mgmt-backup",owner_is_controller="true"}'
        values: '_x180 1x160'
      - series: 'kube_job_status_start_time{job="kube-state-metrics",namespace="vrsky-database",job_name="vrsky-mgmt-backup-180"}'
        values: '_x180 10800x160'
      - series: 'kube_job_failed{job="kube-state-metrics",namespace="vrsky-database",job_name="vrsky-mgmt-backup-180",condition="true"}'
        values: '_x190 1x150'
      - series: 'kube_job_failed{job="kube-state-metrics",namespace="vrsky-database",job_name="vrsky-mgmt-backup-180",condition="false"}'
        values: '_x190 0x150'
      # success, minute 300-310
      - series: 'kube_job_owner{job="kube-state-metrics",namespace="vrsky-database",job_name="vrsky-mgmt-backup-300",owner_kind="CronJob",owner_name="vrsky-mgmt-backup",owner_is_controller="true"}'
        values: '_x300 1x40'
      - series: 'kube_job_status_start_time{job="kube-state-metrics",namespace="vrsky-database",job_name="vrsky-mgmt-backup-300"}'
        values: '_x300 18000x40'
      - series: 'kube_job_status_completion_time{job="kube-state-metrics",namespace="vrsky-database",job_name="vrsky-mgmt-backup-300"}'
        values: '_x310 18600x30'
    alert_rule_test:
      # One failure since the last success: one weekday lost, not two.
      - eval_time: 120m
        alertname: MgmtBackupMissing
        exp_alerts: []
      # Two failures, but still inside the 30-minute hold.
      - eval_time: 200m
        alertname: MgmtBackupMissing
        exp_alerts: []
      - eval_time: 225m
        alertname: MgmtBackupMissing
        exp_alerts:
          - exp_labels:
              alertname: MgmtBackupMissing
              severity: warning
              namespace: vrsky-database
              cronjob: vrsky-mgmt-backup
            exp_annotations:
              summary: "No successful management-DB backup in two running weekdays"
              description: "The vrsky-mgmt-backup CronJob in vrsky-database has not completed a backup on two weekdays the cluster ran, or has stopped being scheduled. Read the last Job's log (kubectl -n vrsky-database logs job/<name>) and see docs/DR.md."
      # The next run succeeded: the two failures are before it and stop counting.
      - eval_time: 330m
        alertname: MgmtBackupMissing
        exp_alerts: []

  # 11b. MgmtBackupMissing (a) while suspended — the same two failures, but
  #      the CronJob is suspended (the state it ships in until the human
  #      creates vrsky-backup-config). Thursday morning UTC.
  - name: backup-a-suspended
    interval: 1m
    input_series:
      - series: 'kube_cronjob_spec_suspend{job="kube-state-metrics",namespace="vrsky-database",cronjob="vrsky-mgmt-backup"}'
        values: '1x340'
      - series: 'kube_cronjob_created{job="kube-state-metrics",namespace="vrsky-database",cronjob="vrsky-mgmt-backup"}'
        values: '60x340'
      - series: 'kube_cronjob_status_last_schedule_time{job="kube-state-metrics",namespace="vrsky-database",cronjob="vrsky-mgmt-backup"}'
        values: '_x10 600x49 3600x119 10800x160'
      - series: 'kube_job_owner{job="kube-state-metrics",namespace="vrsky-database",job_name="vrsky-mgmt-backup-10",owner_kind="CronJob",owner_name="vrsky-mgmt-backup",owner_is_controller="true"}'
        values: '_x10 1x330'
      - series: 'kube_job_status_start_time{job="kube-state-metrics",namespace="vrsky-database",job_name="vrsky-mgmt-backup-10"}'
        values: '_x10 600x330'
      - series: 'kube_job_status_completion_time{job="kube-state-metrics",namespace="vrsky-database",job_name="vrsky-mgmt-backup-10"}'
        values: '_x20 1200x320'
      - series: 'kube_job_owner{job="kube-state-metrics",namespace="vrsky-database",job_name="vrsky-mgmt-backup-60",owner_kind="CronJob",owner_name="vrsky-mgmt-backup",owner_is_controller="true"}'
        values: '_x60 1x280'
      - series: 'kube_job_status_start_time{job="kube-state-metrics",namespace="vrsky-database",job_name="vrsky-mgmt-backup-60"}'
        values: '_x60 3600x280'
      - series: 'kube_job_failed{job="kube-state-metrics",namespace="vrsky-database",job_name="vrsky-mgmt-backup-60",condition="true"}'
        values: '_x70 1x270'
      - series: 'kube_job_owner{job="kube-state-metrics",namespace="vrsky-database",job_name="vrsky-mgmt-backup-180",owner_kind="CronJob",owner_name="vrsky-mgmt-backup",owner_is_controller="true"}'
        values: '_x180 1x160'
      - series: 'kube_job_status_start_time{job="kube-state-metrics",namespace="vrsky-database",job_name="vrsky-mgmt-backup-180"}'
        values: '_x180 10800x160'
      - series: 'kube_job_failed{job="kube-state-metrics",namespace="vrsky-database",job_name="vrsky-mgmt-backup-180",condition="true"}'
        values: '_x190 1x150'
    alert_rule_test:
      - eval_time: 225m
        alertname: MgmtBackupMissing
        exp_alerts: []
      - eval_time: 330m
        alertname: MgmtBackupMissing
        exp_alerts: []

  # 11c. MgmtBackupMissing (a) when no backup ever succeeded — the count
  #      starts at the CronJob's creation instead. Thursday morning UTC.
  - name: backup-a-never-succeeded
    interval: 1m
    input_series:
      - series: 'kube_cronjob_spec_suspend{job="kube-state-metrics",namespace="vrsky-database",cronjob="vrsky-mgmt-backup"}'
        values: '0x340'
      - series: 'kube_cronjob_created{job="kube-state-metrics",namespace="vrsky-database",cronjob="vrsky-mgmt-backup"}'
        values: '60x340'
      - series: 'kube_cronjob_status_last_schedule_time{job="kube-state-metrics",namespace="vrsky-database",cronjob="vrsky-mgmt-backup"}'
        values: '_x60 3600x119 10800x160'
      - series: 'kube_job_owner{job="kube-state-metrics",namespace="vrsky-database",job_name="vrsky-mgmt-backup-60",owner_kind="CronJob",owner_name="vrsky-mgmt-backup",owner_is_controller="true"}'
        values: '_x60 1x280'
      - series: 'kube_job_status_start_time{job="kube-state-metrics",namespace="vrsky-database",job_name="vrsky-mgmt-backup-60"}'
        values: '_x60 3600x280'
      - series: 'kube_job_failed{job="kube-state-metrics",namespace="vrsky-database",job_name="vrsky-mgmt-backup-60",condition="true"}'
        values: '_x70 1x270'
      - series: 'kube_job_failed{job="kube-state-metrics",namespace="vrsky-database",job_name="vrsky-mgmt-backup-60",condition="false"}'
        values: '_x70 0x270'
      - series: 'kube_job_owner{job="kube-state-metrics",namespace="vrsky-database",job_name="vrsky-mgmt-backup-180",owner_kind="CronJob",owner_name="vrsky-mgmt-backup",owner_is_controller="true"}'
        values: '_x180 1x160'
      - series: 'kube_job_status_start_time{job="kube-state-metrics",namespace="vrsky-database",job_name="vrsky-mgmt-backup-180"}'
        values: '_x180 10800x160'
      - series: 'kube_job_failed{job="kube-state-metrics",namespace="vrsky-database",job_name="vrsky-mgmt-backup-180",condition="true"}'
        values: '_x190 1x150'
      - series: 'kube_job_failed{job="kube-state-metrics",namespace="vrsky-database",job_name="vrsky-mgmt-backup-180",condition="false"}'
        values: '_x190 0x150'
    alert_rule_test:
      - eval_time: 150m
        alertname: MgmtBackupMissing
        exp_alerts: []
      - eval_time: 225m
        alertname: MgmtBackupMissing
        exp_alerts:
          - exp_labels:
              alertname: MgmtBackupMissing
              severity: warning
              namespace: vrsky-database
              cronjob: vrsky-mgmt-backup
            exp_annotations:
              summary: "No successful management-DB backup in two running weekdays"
              description: "The vrsky-mgmt-backup CronJob in vrsky-database has not completed a backup on two weekdays the cluster ran, or has stopped being scheduled. Read the last Job's log (kubectl -n vrsky-database logs job/<name>) and see docs/DR.md."

  # 11d. MgmtBackupMissing (a) counts only its own Jobs. The backup has one
  #      failure since its last success; next to it in vrsky-database a
  #      different CronJob has two failed Jobs and a hand-made Job with no
  #      owner failed too. Neither may count towards the backup, and the
  #      other CronJob is not this alert's business. Thursday morning UTC.
  - name: backup-a-own-jobs-only
    interval: 1m
    input_series:
      - series: 'kube_cronjob_spec_suspend{job="kube-state-metrics",namespace="vrsky-database",cronjob="vrsky-mgmt-backup"}'
        values: '0x340'
      - series: 'kube_cronjob_created{job="kube-state-metrics",namespace="vrsky-database",cronjob="vrsky-mgmt-backup"}'
        values: '60x340'
      - series: 'kube_cronjob_status_last_schedule_time{job="kube-state-metrics",namespace="vrsky-database",cronjob="vrsky-mgmt-backup"}'
        values: '_x10 600x49 3600x280'
      - series: 'kube_job_owner{job="kube-state-metrics",namespace="vrsky-database",job_name="vrsky-mgmt-backup-10",owner_kind="CronJob",owner_name="vrsky-mgmt-backup",owner_is_controller="true"}'
        values: '_x10 1x330'
      - series: 'kube_job_status_start_time{job="kube-state-metrics",namespace="vrsky-database",job_name="vrsky-mgmt-backup-10"}'
        values: '_x10 600x330'
      - series: 'kube_job_status_completion_time{job="kube-state-metrics",namespace="vrsky-database",job_name="vrsky-mgmt-backup-10"}'
        values: '_x20 1200x320'
      - series: 'kube_job_owner{job="kube-state-metrics",namespace="vrsky-database",job_name="vrsky-mgmt-backup-60",owner_kind="CronJob",owner_name="vrsky-mgmt-backup",owner_is_controller="true"}'
        values: '_x60 1x280'
      - series: 'kube_job_status_start_time{job="kube-state-metrics",namespace="vrsky-database",job_name="vrsky-mgmt-backup-60"}'
        values: '_x60 3600x280'
      - series: 'kube_job_failed{job="kube-state-metrics",namespace="vrsky-database",job_name="vrsky-mgmt-backup-60",condition="true"}'
        values: '_x70 1x270'
      # the other CronJob: unsuspended, two failures
      - series: 'kube_cronjob_spec_suspend{job="kube-state-metrics",namespace="vrsky-database",cronjob="vrsky-other"}'
        values: '0x340'
      - series: 'kube_cronjob_created{job="kube-state-metrics",namespace="vrsky-database",cronjob="vrsky-other"}'
        values: '60x340'
      - series: 'kube_cronjob_status_last_schedule_time{job="kube-state-metrics",namespace="vrsky-database",cronjob="vrsky-other"}'
        values: '_x120 7200x59 10800x160'
      - series: 'kube_job_owner{job="kube-state-metrics",namespace="vrsky-database",job_name="vrsky-other-120",owner_kind="CronJob",owner_name="vrsky-other",owner_is_controller="true"}'
        values: '_x120 1x220'
      - series: 'kube_job_status_start_time{job="kube-state-metrics",namespace="vrsky-database",job_name="vrsky-other-120"}'
        values: '_x120 7200x220'
      - series: 'kube_job_failed{job="kube-state-metrics",namespace="vrsky-database",job_name="vrsky-other-120",condition="true"}'
        values: '_x130 1x210'
      - series: 'kube_job_owner{job="kube-state-metrics",namespace="vrsky-database",job_name="vrsky-other-180",owner_kind="CronJob",owner_name="vrsky-other",owner_is_controller="true"}'
        values: '_x180 1x160'
      - series: 'kube_job_status_start_time{job="kube-state-metrics",namespace="vrsky-database",job_name="vrsky-other-180"}'
        values: '_x180 10800x160'
      - series: 'kube_job_failed{job="kube-state-metrics",namespace="vrsky-database",job_name="vrsky-other-180",condition="true"}'
        values: '_x190 1x150'
      # a Job made by hand, no owner
      - series: 'kube_job_owner{job="kube-state-metrics",namespace="vrsky-database",job_name="manual-restore-check",owner_kind="<none>",owner_name="<none>",owner_is_controller="<none>"}'
        values: '_x150 1x190'
      - series: 'kube_job_status_start_time{job="kube-state-metrics",namespace="vrsky-database",job_name="manual-restore-check"}'
        values: '_x150 9000x190'
      - series: 'kube_job_failed{job="kube-state-metrics",namespace="vrsky-database",job_name="manual-restore-check",condition="true"}'
        values: '_x160 1x180'
    alert_rule_test:
      - eval_time: 225m
        alertname: MgmtBackupMissing
        exp_alerts: []
      - eval_time: 330m
        alertname: MgmtBackupMissing
        exp_alerts: []

  # 11e. MgmtBackupMissing (b) — the CronJob stopped being scheduled. The
  #      last run was Thursday 11:00 UTC (noon in Oslo, winter time) and
  #      succeeded; nothing is scheduled after it. 98 hours later is
  #      Monday 13:00 UTC.
  - name: backup-b-stopped-scheduling
    interval: 1m
    input_series:
      - series: 'kube_cronjob_spec_suspend{job="kube-state-metrics",namespace="vrsky-database",cronjob="vrsky-mgmt-backup"}'
        values: '0x6700'
      - series: 'kube_cronjob_created{job="kube-state-metrics",namespace="vrsky-database",cronjob="vrsky-mgmt-backup"}'
        values: '60x6700'
      - series: 'kube_cronjob_status_last_schedule_time{job="kube-state-metrics",namespace="vrsky-database",cronjob="vrsky-mgmt-backup"}'
        values: '_x660 39600x6040'
      - series: 'kube_job_owner{job="kube-state-metrics",namespace="vrsky-database",job_name="vrsky-mgmt-backup-660",owner_kind="CronJob",owner_name="vrsky-mgmt-backup",owner_is_controller="true"}'
        values: '_x660 1x6040'
      - series: 'kube_job_status_start_time{job="kube-state-metrics",namespace="vrsky-database",job_name="vrsky-mgmt-backup-660"}'
        values: '_x660 39600x6040'
      - series: 'kube_job_status_completion_time{job="kube-state-metrics",namespace="vrsky-database",job_name="vrsky-mgmt-backup-660"}'
        values: '_x670 40200x6030'
    alert_rule_test:
      # Monday 12:30 UTC: after noon on a weekday, but 97.5 hours since the
      # last schedule, under the 98.
      - eval_time: 6510m
        alertname: MgmtBackupMissing
        exp_alerts: []
      # Monday 14:00 UTC: 99 hours, past the threshold and the 30-minute hold.
      - eval_time: 6600m
        alertname: MgmtBackupMissing
        exp_alerts:
          - exp_labels:
              alertname: MgmtBackupMissing
              severity: warning
              namespace: vrsky-database
              cronjob: vrsky-mgmt-backup
            exp_annotations:
              summary: "No successful management-DB backup in two running weekdays"
              description: "The vrsky-mgmt-backup CronJob in vrsky-database has not completed a backup on two weekdays the cluster ran, or has stopped being scheduled. Read the last Job's log (kubectl -n vrsky-database logs job/<name>) and see docs/DR.md."

  # 11f. MgmtBackupMissing (b) only on weekday afternoons. Last schedule
  #      Thursday 00:01 UTC of the first day, so from Monday 02:01 on it is
  #      always more than 98 hours old; what decides is the day and the hour.
  #      Scraped every 5 minutes: the 7-day backstop over two weeks of
  #      1-minute samples is more than promtool's per-query sample limit.
  - name: backup-b-weekday-afternoons
    interval: 5m
    input_series:
      - series: 'kube_cronjob_spec_suspend{job="kube-state-metrics",namespace="vrsky-database",cronjob="vrsky-mgmt-backup"}'
        values: '0x2760'
      - series: 'kube_cronjob_created{job="kube-state-metrics",namespace="vrsky-database",cronjob="vrsky-mgmt-backup"}'
        values: '60x2760'
      - series: 'kube_cronjob_status_last_schedule_time{job="kube-state-metrics",namespace="vrsky-database",cronjob="vrsky-mgmt-backup"}'
        values: '60x2760'
      - series: 'kube_job_owner{job="kube-state-metrics",namespace="vrsky-database",job_name="vrsky-mgmt-backup-1",owner_kind="CronJob",owner_name="vrsky-mgmt-backup",owner_is_controller="true"}'
        values: '1x2760'
      - series: 'kube_job_status_start_time{job="kube-state-metrics",namespace="vrsky-database",job_name="vrsky-mgmt-backup-1"}'
        values: '60x2760'
      - series: 'kube_job_status_completion_time{job="kube-state-metrics",namespace="vrsky-database",job_name="vrsky-mgmt-backup-1"}'
        values: '_x1 120x2759'
    alert_rule_test:
      # Monday 11:00 UTC: stale for 107 hours, but before the noon run.
      - eval_time: 6420m
        alertname: MgmtBackupMissing
        exp_alerts: []
      # Monday 13:00 UTC: weekday afternoon, fires.
      - eval_time: 6540m
        alertname: MgmtBackupMissing
        exp_alerts:
          - exp_labels:
              alertname: MgmtBackupMissing
              severity: warning
              namespace: vrsky-database
              cronjob: vrsky-mgmt-backup
            exp_annotations:
              summary: "No successful management-DB backup in two running weekdays"
              description: "The vrsky-mgmt-backup CronJob in vrsky-database has not completed a backup on two weekdays the cluster ran, or has stopped being scheduled. Read the last Job's log (kubectl -n vrsky-database logs job/<name>) and see docs/DR.md."
      # Friday of the next week, 13:00 UTC: still a weekday afternoon.
      - eval_time: 12300m
        alertname: MgmtBackupMissing
        exp_alerts:
          - exp_labels:
              alertname: MgmtBackupMissing
              severity: warning
              namespace: vrsky-database
              cronjob: vrsky-mgmt-backup
            exp_annotations:
              summary: "No successful management-DB backup in two running weekdays"
              description: "The vrsky-mgmt-backup CronJob in vrsky-database has not completed a backup on two weekdays the cluster ran, or has stopped being scheduled. Read the last Job's log (kubectl -n vrsky-database logs job/<name>) and see docs/DR.md."
      # Saturday 14:00 UTC of the next week: (b) is off at weekends, but
      # nothing has happened for over 7 days, so the backstop (c) pages.
      # The weekend gate of (b) alone is 11n.
      - eval_time: 13800m
        alertname: MgmtBackupMissing
        exp_alerts:
          - exp_labels:
              alertname: MgmtBackupMissing
              severity: warning
              namespace: vrsky-database
              cronjob: vrsky-mgmt-backup
            exp_annotations:
              summary: "No successful management-DB backup in two running weekdays"
              description: "The vrsky-mgmt-backup CronJob in vrsky-database has not completed a backup on two weekdays the cluster ran, or has stopped being scheduled. Read the last Job's log (kubectl -n vrsky-database logs job/<name>) and see docs/DR.md."

  # 11o. MgmtBackupMissing (c) right after activation. Created at t=0,
  #      suspended until the second Saturday 00:00 UTC, then activated. Nine
  #      days old and never scheduled, but active for two hours: the backstop
  #      must stay quiet as (b) does in 11h.
  - name: backup-c-after-activation
    interval: 5m
    input_series:
      - series: 'kube_cronjob_spec_suspend{job="kube-state-metrics",namespace="vrsky-database",cronjob="vrsky-mgmt-backup"}'
        values: '1x2591 0x30'
      - series: 'kube_cronjob_created{job="kube-state-metrics",namespace="vrsky-database",cronjob="vrsky-mgmt-backup"}'
        values: '0x2621'
    alert_rule_test:
      - eval_time: 13080m
        alertname: MgmtBackupMissing
        exp_alerts: []

  # 11n. MgmtBackupMissing (b) is off at weekends. Last run Tuesday 11:00 UTC
  #      (day 5); the next Saturday 14:00 UTC is 99 hours later, past (b)'s
  #      98 but well under the backstop's 7 days. Quiet.
  - name: backup-b-off-at-weekends
    interval: 5m
    input_series:
      - series: 'kube_cronjob_spec_suspend{job="kube-state-metrics",namespace="vrsky-database",cronjob="vrsky-mgmt-backup"}'
        values: '0x2770'
      - series: 'kube_cronjob_created{job="kube-state-metrics",namespace="vrsky-database",cronjob="vrsky-mgmt-backup"}'
        values: '0x2770'
      - series: 'kube_cronjob_status_last_schedule_time{job="kube-state-metrics",namespace="vrsky-database",cronjob="vrsky-mgmt-backup"}'
        values: '0x1571 471600x1198'
    alert_rule_test:
      - eval_time: 13800m
        alertname: MgmtBackupMissing
        exp_alerts: []

  # 11g. MgmtBackupMissing (b) while suspended: as 11f at Monday 13:00 UTC,
  #      but the CronJob is suspended. A suspended CronJob is never
  #      scheduled, so its stale schedule time must not page.
  - name: backup-b-suspended
    interval: 1m
    input_series:
      - series: 'kube_cronjob_spec_suspend{job="kube-state-metrics",namespace="vrsky-database",cronjob="vrsky-mgmt-backup"}'
        values: '1x6600'
      - series: 'kube_cronjob_created{job="kube-state-metrics",namespace="vrsky-database",cronjob="vrsky-mgmt-backup"}'
        values: '60x6600'
      - series: 'kube_cronjob_status_last_schedule_time{job="kube-state-metrics",namespace="vrsky-database",cronjob="vrsky-mgmt-backup"}'
        values: '60x6600'
    alert_rule_test:
      - eval_time: 6540m
        alertname: MgmtBackupMissing
        exp_alerts: []

  # 11h. MgmtBackupMissing (b) right after activation. The CronJob was
  #      created at t=0 and stayed suspended (no vrsky-backup-config) until
  #      Monday 12:30 UTC, when the human created the Secret and unsuspended
  #      it. Nothing has been scheduled yet, and the CronJob is days old: the
  #      created-time fallback alone would page within 30 minutes. It must
  #      stay quiet until the CronJob has been active for 98 hours with
  #      nothing happening, and page then.
  #      Scraped every 5 minutes: the 7-day backstop over 1-minute samples
  #      is more than promtool's per-query sample limit.
  - name: backup-b-after-activation
    interval: 5m
    input_series:
      - series: 'kube_cronjob_spec_suspend{job="kube-state-metrics",namespace="vrsky-database",cronjob="vrsky-mgmt-backup"}'
        values: '1x1301 0x1200'
      - series: 'kube_cronjob_created{job="kube-state-metrics",namespace="vrsky-database",cronjob="vrsky-mgmt-backup"}'
        values: '0x2502'
    alert_rule_test:
      # Monday 13:30 and 14:30 UTC, one and two hours after activation.
      - eval_time: 6570m
        alertname: MgmtBackupMissing
        exp_alerts: []
      - eval_time: 6630m
        alertname: MgmtBackupMissing
        exp_alerts: []
      # Friday 15:30 UTC: active for 99 hours and never scheduled.
      - eval_time: 12450m
        alertname: MgmtBackupMissing
        exp_alerts:
          - exp_labels:
              alertname: MgmtBackupMissing
              severity: warning
              namespace: vrsky-database
              cronjob: vrsky-mgmt-backup
            exp_annotations:
              summary: "No successful management-DB backup in two running weekdays"
              description: "The vrsky-mgmt-backup CronJob in vrsky-database has not completed a backup on two weekdays the cluster ran, or has stopped being scheduled. Read the last Job's log (kubectl -n vrsky-database logs job/<name>) and see docs/DR.md."

  # 11i. MgmtBackupMissing (b) after a manual backup. As 11e, the last
  #      scheduled run was Thursday 11:00 UTC, but an operator ran
  #      `kubectl create job --from=cronjob/vrsky-mgmt-backup` on Monday and
  #      it succeeded at 09:00 UTC. A manual Job sets no lastScheduleTime;
  #      its success still counts as a fresh backup.
  - name: backup-b-manual-backup
    interval: 1m
    input_series:
      - series: 'kube_cronjob_spec_suspend{job="kube-state-metrics",namespace="vrsky-database",cronjob="vrsky-mgmt-backup"}'
        values: '0x6700'
      - series: 'kube_cronjob_created{job="kube-state-metrics",namespace="vrsky-database",cronjob="vrsky-mgmt-backup"}'
        values: '60x6700'
      - series: 'kube_cronjob_status_last_schedule_time{job="kube-state-metrics",namespace="vrsky-database",cronjob="vrsky-mgmt-backup"}'
        values: '_x660 39600x6040'
      - series: 'kube_job_owner{job="kube-state-metrics",namespace="vrsky-database",job_name="backup-manual-1",owner_kind="CronJob",owner_name="vrsky-mgmt-backup",owner_is_controller="true"}'
        values: '_x5810 1x890'
      - series: 'kube_job_status_start_time{job="kube-state-metrics",namespace="vrsky-database",job_name="backup-manual-1"}'
        values: '_x5810 348600x890'
      - series: 'kube_job_status_completion_time{job="kube-state-metrics",namespace="vrsky-database",job_name="backup-manual-1"}'
        values: '_x5820 349200x880'
    alert_rule_test:
      # Monday 14:00 UTC: 99 hours since the last schedule (11e pages here),
      # 5 hours since the manual backup.
      - eval_time: 6600m
        alertname: MgmtBackupMissing
        exp_alerts: []

  # 11j. MgmtBackupMissing (b) after a late start. The cluster was parked
  #      from before Thursday's run until Monday 12:30 UTC (13:30 Oslo).
  #      startingDeadlineSeconds is 4h, so the CronJob runs Monday's noon
  #      dump at start-up and lastScheduleTime moves to Monday 11:00 UTC.
  #      Quiet.
  - name: backup-b-late-start
    interval: 1m
    input_series:
      - series: 'kube_cronjob_spec_suspend{job="kube-state-metrics",namespace="vrsky-database",cronjob="vrsky-mgmt-backup"}'
        values: '_x6509 0x200'
      - series: 'kube_cronjob_created{job="kube-state-metrics",namespace="vrsky-database",cronjob="vrsky-mgmt-backup"}'
        values: '_x6509 60x200'
      - series: 'kube_cronjob_status_last_schedule_time{job="kube-state-metrics",namespace="vrsky-database",cronjob="vrsky-mgmt-backup"}'
        values: '_x6509 39600 385200x199'
    alert_rule_test:
      # Monday 14:00 and 15:00 UTC (15:00 and 16:00 Oslo).
      - eval_time: 6600m
        alertname: MgmtBackupMissing
        exp_alerts: []
      - eval_time: 6660m
        alertname: MgmtBackupMissing
        exp_alerts: []

  # 11k. MgmtBackupMissing (b) with a cluster started late every day and a
  #      CronJob that never runs. Up 12:30-15:00 UTC (13:30-16:00 Oslo) on
  #      Thursday, Friday and Monday, nothing ever scheduled. Before the
  #      review fix an `offset 3h` gate kept this silent for good; now it
  #      pages on the first weekday afternoon past 98 hours.
  - name: backup-b-late-cluster-never-runs
    interval: 1m
    input_series:
      - series: 'kube_cronjob_spec_suspend{job="kube-state-metrics",namespace="vrsky-database",cronjob="vrsky-mgmt-backup"}'
        values: '_x750 0x150 _x1289 0x150 _x4169 0x150'
      - series: 'kube_cronjob_created{job="kube-state-metrics",namespace="vrsky-database",cronjob="vrsky-mgmt-backup"}'
        values: '_x750 0x150 _x1289 0x150 _x4169 0x150'
    alert_rule_test:
      # Friday 14:00 UTC: 38 hours, quiet.
      - eval_time: 2280m
        alertname: MgmtBackupMissing
        exp_alerts: []
      # Monday 14:00 UTC: 110 hours, an hour and a half after the start.
      - eval_time: 6600m
        alertname: MgmtBackupMissing
        exp_alerts:
          - exp_labels:
              alertname: MgmtBackupMissing
              severity: warning
              namespace: vrsky-database
              cronjob: vrsky-mgmt-backup
            exp_annotations:
              summary: "No successful management-DB backup in two running weekdays"
              description: "The vrsky-mgmt-backup CronJob in vrsky-database has not completed a backup on two weekdays the cluster ran, or has stopped being scheduled. Read the last Job's log (kubectl -n vrsky-database logs job/<name>) and see docs/DR.md."

  # 11l. MgmtBackupMissing (c), the 7-day backstop, outside the weekday and
  #      hour gate. Active since t=0 and never scheduled. On the second
  #      Saturday at 02:00 UTC (b) is gated off; only (c) keeps it firing.
  #      One suspended sample at Saturday 01:00 UTC (a flicker) must not
  #      mute the backstop for a week either.
  #      Scraped every 5 minutes: a week of 1-minute samples is more than
  #      promtool's per-query sample limit.
  - name: backup-c-backstop
    interval: 5m
    input_series:
      - series: 'kube_cronjob_spec_suspend{job="kube-state-metrics",namespace="vrsky-database",cronjob="vrsky-mgmt-backup"}'
        values: '0x2579 1 0x40'
      - series: 'kube_cronjob_created{job="kube-state-metrics",namespace="vrsky-database",cronjob="vrsky-mgmt-backup"}'
        values: '0x2620'
    alert_rule_test:
      - eval_time: 13080m
        alertname: MgmtBackupMissing
        exp_alerts:
          - exp_labels:
              alertname: MgmtBackupMissing
              severity: warning
              namespace: vrsky-database
              cronjob: vrsky-mgmt-backup
            exp_annotations:
              summary: "No successful management-DB backup in two running weekdays"
              description: "The vrsky-mgmt-backup CronJob in vrsky-database has not completed a backup on two weekdays the cluster ran, or has stopped being scheduled. Read the last Job's log (kubectl -n vrsky-database logs job/<name>) and see docs/DR.md."

  # 11m. MgmtBackupMissing (b) after a one-sample suspend flicker. As 11e,
  #      but a single suspend=1 sample at Monday 12:00 UTC (an old deploy
  #      that applied the file before patching). It must not mute the alert
  #      for 98 hours: 11e's page still comes at Monday 14:00 UTC.
  - name: backup-b-suspend-flicker
    interval: 1m
    input_series:
      - series: 'kube_cronjob_spec_suspend{job="kube-state-metrics",namespace="vrsky-database",cronjob="vrsky-mgmt-backup"}'
        values: '0x6479 1 0x220'
      - series: 'kube_cronjob_created{job="kube-state-metrics",namespace="vrsky-database",cronjob="vrsky-mgmt-backup"}'
        values: '60x6700'
      - series: 'kube_cronjob_status_last_schedule_time{job="kube-state-metrics",namespace="vrsky-database",cronjob="vrsky-mgmt-backup"}'
        values: '_x660 39600x6040'
      - series: 'kube_job_owner{job="kube-state-metrics",namespace="vrsky-database",job_name="vrsky-mgmt-backup-660",owner_kind="CronJob",owner_name="vrsky-mgmt-backup",owner_is_controller="true"}'
        values: '_x660 1x6040'
