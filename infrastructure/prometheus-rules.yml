# VRSky default alert ruleset (Phase 3A — #84).
#
# Routing: alerts with a tenant_id label are dispatched by the management-api
# to that tenant's notification targets; the rest are platform alerts and go
# to targets flagged platform=true. Unit tests: prometheus-rules-test.yml
# (promtool test rules).

groups:
  - name: vrsky-pipelines
    rules:
      # A polled source has gone quiet: a connection that published during the
      # six hours before the last hour has published nothing for an hour. Per
      # connection, and for polling connectors only -- a webhook or queue source
      # is quiet whenever its sender is, and that is not a fault. The quiet
      # window has to dwarf any poll interval: Business Central polls every 15
      # minutes and publishes once per poll, and the former 5-minute rate window
      # with "for: 10m" fired on that cadence alone, 92 times in one day
      # (2026-10-08), each for a few seconds.
      #
      # The third clause: the counter must have been scraped for the whole
      # hour -- 120 samples at the 30 s interval in
      # kubernetes/monitoring/podmonitors.yaml, so fewer than 100 means the
      # cluster was parked (az aks stop) within the hour. Without it a start
      # after a long stop fired at once: no samples in the last hour, the
      # pre-stop publishes still in the comparison window (2026-10-19). The
      # sum folds the old and new pod of a rolling restart together.
      - alert: PipelineDown
        expr: |
          sum by (tenant_id, connection_id) (
            increase(vrsky_messages_published_total{connector=~"vrsky-(api|brightpearl|business-central|cloud-storage|db|file|salesforce|sap-s4hana|sftp|sitoo|visma)-consumer"}[1h])
          ) == 0
          and
          sum by (tenant_id, connection_id) (
            increase(vrsky_messages_published_total{connector=~"vrsky-(api|brightpearl|business-central|cloud-storage|db|file|salesforce|sap-s4hana|sftp|sitoo|visma)-consumer"}[6h] offset 1h)
          ) > 0
          and
          sum by (tenant_id, connection_id) (
            count_over_time(vrsky_messages_published_total{connector=~"vrsky-(api|brightpearl|business-central|cloud-storage|db|file|salesforce|sap-s4hana|sftp|sitoo|visma)-consumer"}[1h])
          ) >= 100
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "pipeline {{ $labels.connection_id }} has published nothing for an hour (tenant {{ $labels.tenant_id }})"
          description: "A polled source for tenant {{ $labels.tenant_id }} published during the previous six hours and nothing in the last hour. Check the pipeline's events and the source's credentials."

      # Messages are being dead-lettered. pipeline_id is the connection id;
      # the metric carries no tenant label, so this routes as a platform alert.
      - alert: DLQGrowing
        expr: sum by (pipeline_id) (increase(vrsky_dlq_messages_total[10m])) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "DLQ growing for pipeline {{ $labels.pipeline_id }}"
          description: "Messages moved to the dead-letter queue in the last 10 minutes — a producer is repeatedly failing to deliver."

      # A deployed pipeline is stuck in status "error" (management-api gauge
      # vrsky_connections, refreshed from the DB every 30 s). tenant_id routes
      # it to the workspace's own notification targets.
      - alert: ConnectionInError
        # max, not sum: every management-api replica publishes the same
        # gauge, so a sum would count each pipeline once per replica.
        expr: max by (tenant_id) (vrsky_connections{status="error"}) > 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "{{ $value | printf \"%.0f\" }} pipeline(s) in error for workspace {{ $labels.tenant_id }}"
          description: "At least one deployed pipeline has been in status error for 10 minutes. Open the builder's pipeline log for the reason, fix the configuration and redeploy."

      # A registered remote agent (till) has not polled for an hour. Its
      # deliveries wait in VRSky for 72 h; after that they are lost.
      - alert: RemoteAgentOffline
        expr: vrsky_remote_agent_online == 0
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "remote agent {{ $labels.agent }} offline for over 1 hour"
          description: "Agent {{ $labels.agent }} in workspace {{ $labels.tenant_id }} has not polled VRSky for an hour. Its pipelines hold data for up to 72 hours. Check the machine, the VRSkyAgent service and its network."

  - name: vrsky-platform
    rules:
      # A VRSky Deployment with no available replica for 10 minutes: a
      # connector that cannot start (ImagePullBackOff, OOM) or a management
      # API outage. kube-state-metrics; platform alert (no tenant_id).
      # A deployment parked on purpose (spec.replicas 0 — the alert responder
      # since 2026-10-05) is not unavailable; without the second clause it
      # fired non-stop and Teams got a reminder every repeat_interval.
      - alert: ConnectorUnavailable
        expr: |
          kube_deployment_status_replicas_available{namespace="vrsky-platform",deployment=~"vrsky-.*"} == 0
            and on (namespace, deployment)
          kube_deployment_spec_replicas{namespace="vrsky-platform"} > 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.deployment }} has no running replica"
          description: "Deployment {{ $labels.deployment }} in vrsky-platform has had 0 available replicas for 10 minutes. Every pipeline using that connector is stalled."

      # JetStream consumer backlog (prometheus-nats-exporter -jsz).
      - alert: JetStreamLagHigh
        expr: jetstream_consumer_num_pending > 1000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "JetStream consumer {{ $labels.consumer_name }} lag above 1000"
          description: "Pending (undelivered) messages for the consumer exceeded 1000 for 10 minutes — the worker is falling behind or down."

      # TLS certificate within 14 days of expiry (management-api gauge from
      # TLS_CERT_PATHS).
      - alert: CertExpirySoon
        expr: (vrsky_tls_cert_expiry_timestamp_seconds - time()) < 14 * 24 * 3600
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "TLS certificate {{ $labels.path }} expires in under 14 days"
          description: "Renew the certificate at {{ $labels.path }} before it expires."

      # Management API 5xx ratio above 5% over 5 minutes.
      - alert: MgmtAPIErrorRate
        expr: |
          sum(rate(vrsky_mgmtapi_http_requests_total{status=~"5.."}[5m]))
          /
          sum(rate(vrsky_mgmtapi_http_requests_total[5m])) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "management-api 5xx error rate above 5%"
          description: "More than 5% of management API requests returned a server error over the last 5 minutes."

      # A tenant NATS instance at/above 80% of its scale-up trigger (#19). The
      # autoscaler provisions a new instance past 100%; this warns operators
      # ahead of that. tenant_id label routes it to the tenant's targets.
      - alert: NATSInstanceApproachingCapacity
        expr: vrsky_nats_instance_capacity_pct >= 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "tenant NATS instance {{ $labels.tenant_id }}/{{ $labels.instance_number }} at {{ $value | printf \"%.0f\" }}% capacity"
          description: "NATS instance {{ $labels.instance_number }} for tenant {{ $labels.tenant_id }} is at/above 80% of its scale-up trigger; the autoscaler adds an instance past 100%."

      # A node's CPU reservations near its allocatable: the next pod may not
      # schedule, long before any CPU is actually busy. Requests are what
      # the scheduler reserves; on 2026-10-14 node 0 sat at 90% reserved and
      # 2% used (plans/cpu-request-headroom.md). Right-size before scaling.
      # Only pods that hold their reservation count: kube-state-metrics keeps
      # the requests of Succeeded and Failed pods too, and every deploy step
      # leaves a finished `az aks command invoke` pod (200m) in aks-command.
      # On one node those pushed the sum to 106% while the scheduler saw 72%
      # (2026-10-22), and the smoke check failed three deploys on it.
      - alert: NodeCPURequestsHigh
        expr: |
          sum by (node) (
            kube_pod_container_resource_requests{resource="cpu", unit="core"}
              and on (namespace, pod) (kube_pod_status_phase{phase=~"Pending|Running"} == 1)
          )
            / on (node) kube_node_status_allocatable{resource="cpu", unit="core"} > 0.85
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "node {{ $labels.node }} has {{ $value | humanizePercentage }} of its CPU reserved"
          description: "CPU requests on {{ $labels.node }} have exceeded 85% of allocatable for an hour. Right-size requests (plans/cpu-request-headroom.md) before adding a node; usage is usually a fraction of this."

      # Host filesystem above 80% (node-exporter; tmpfs/overlay excluded).
      - alert: DiskUsageHigh
        expr: |
          (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"}
             / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"}) > 0.80
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "disk usage above 80% on {{ $labels.mountpoint }}"
          description: "Filesystem {{ $labels.mountpoint }} ({{ $labels.device }}) is over 80% full."

  # Not a vrsky-* group on purpose: smoke-alerts.sh fails a deploy on any
  # firing vrsky-* alert above info, and a failing backup is neither caused
  # nor fixed by a code deploy. It still reaches Teams through Alertmanager
  # like every platform alert (no tenant_id).
  - name: backup
    rules:
      # The management-DB backup CronJob (#395, infrastructure/kubernetes/
      # backup/cronjob.yaml) has not produced a backup on two weekdays the
      # cluster ran. kube-state-metrics; the CronJob runs weekdays at 12:00
      # Oslo and only while the cluster is up, so it creates at most one Job
      # per running weekday.
      #
      # (a) Two or more of its Jobs failed after the last successful one
      #     finished (after the CronJob was created, if none ever did).
      #     Counting Jobs rather than hours means parked days don't count.
      #     kube_job_status_completion_time is set on success only.
      # (b) Nothing has happened for over 98 hours (Thursday's run to Monday
      #     afternoon): no scheduled run and no successful Job, a manual
      #     `kubectl create job --from=cronjob/...` included (that sets no
      #     lastScheduleTime). Checked Monday to Friday from 12:00 UTC, after
      #     the noon run, and only when the CronJob has been active for the
      #     98 hours (no false alarm right after it is unsuspended). A start
      #     any time before the 16:00 park still runs the day's dump
      #     (startingDeadlineSeconds 4h), so a late start is no excuse.
      #     Catches a CronJob that stopped firing.
      # (c) Backstop: the same, over 7 days, with no weekday or hour gate, so
      #     a cluster that is only ever up outside the gate is not silent.
      # "Active" in (b) and (c) is suspended for under 1% of the window's
      # samples, not "never suspended": one stray suspended sample must not
      # mute the alert for days. Activation after a long suspend is still
      # quiet until the window has (nearly) passed.
      # Suspended (no vrsky-backup-config yet, or paused by hand): silent.
      # MgmtBackupSuspended below covers a suspend that is left in place.
      - alert: MgmtBackupMissing
        expr: |
          (
            label_replace(
              count by (namespace) (
                  (
                      max by (namespace, job_name) (kube_job_status_start_time{namespace="vrsky-database"})
                    * on (namespace, job_name) group_left ()
                      max by (namespace, job_name) (kube_job_owner{namespace="vrsky-database", owner_kind="CronJob", owner_name="vrsky-mgmt-backup"})
                  )
                > on (namespace) group_left ()
                  (
                      max by (namespace) (
                          max by (namespace, job_name) (kube_job_status_completion_time{namespace="vrsky-database"})
                        * on (namespace, job_name) group_left ()
                          max by (namespace, job_name) (kube_job_owner{namespace="vrsky-database", owner_kind="CronJob", owner_name="vrsky-mgmt-backup"})
                      )
                    or
                      max by (namespace) (kube_cronjob_created{namespace="vrsky-database", cronjob="vrsky-mgmt-backup"})
                  )
                and on (namespace, job_name)
                  (max by (namespace, job_name) (kube_job_failed{namespace="vrsky-database", condition="true"}) == 1)
              ) >= 2,
              "cronjob", "vrsky-mgmt-backup", "", ""
            )
            or
            (
                time() - max by (namespace, cronjob) (
                    label_replace(kube_cronjob_status_last_schedule_time{namespace="vrsky-database", cronjob="vrsky-mgmt-backup"}, "fresh", "schedule", "", "")
                  or
                    label_replace(kube_cronjob_status_last_successful_time{namespace="vrsky-database", cronjob="vrsky-mgmt-backup"}, "fresh", "success", "", "")
                  or
                    label_replace(label_replace(
                      max by (namespace) (
                          max by (namespace, job_name) (kube_job_status_completion_time{namespace="vrsky-database"})
                        * on (namespace, job_name) group_left ()
                          max by (namespace, job_name) (kube_job_owner{namespace="vrsky-database", owner_kind="CronJob", owner_name="vrsky-mgmt-backup"})
                      ),
                      "cronjob", "vrsky-mgmt-backup", "", ""), "fresh", "job", "", "")
                  or
                    label_replace(kube_cronjob_created{namespace="vrsky-database", cronjob="vrsky-mgmt-backup"}, "fresh", "created", "", "")
                ) > 352800
              and on () (day_of_week() >= 1 and day_of_week() <= 5 and hour() >= 12)
              and on (namespace, cronjob)
                (max by (namespace, cronjob) (avg_over_time(kube_cronjob_spec_suspend{namespace="vrsky-database", cronjob="vrsky-mgmt-backup"}[98h])) < 0.01)
            )
            or
            (
                time() - max by (namespace, cronjob) (
                    label_replace(kube_cronjob_status_last_schedule_time{namespace="vrsky-database", cronjob="vrsky-mgmt-backup"}, "fresh", "schedule", "", "")
                  or
                    label_replace(kube_cronjob_status_last_successful_time{namespace="vrsky-database", cronjob="vrsky-mgmt-backup"}, "fresh", "success", "", "")
                  or
                    label_replace(label_replace(
                      max by (namespace) (
                          max by (namespace, job_name) (kube_job_status_completion_time{namespace="vrsky-database"})
                        * on (namespace, job_name) group_left ()
                          max by (namespace, job_name) (kube_job_owner{namespace="vrsky-database", owner_kind="CronJob", owner_name="vrsky-mgmt-backup"})
                      ),
                      "cronjob", "vrsky-mgmt-backup", "", ""), "fresh", "job", "", "")
                  or
                    label_replace(kube_cronjob_created{namespace="vrsky-database", cronjob="vrsky-mgmt-backup"}, "fresh", "created", "", "")
                ) > 604800
              and on (namespace, cronjob)
                (max by (namespace, cronjob) (avg_over_time(kube_cronjob_spec_suspend{namespace="vrsky-database", cronjob="vrsky-mgmt-backup"}[7d])) < 0.01)
            )
          )
          and on (namespace, cronjob)
            (max by (namespace, cronjob) (kube_cronjob_spec_suspend{namespace="vrsky-database", cronjob="vrsky-mgmt-backup"}) == 0)
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "No successful management-DB backup in two running weekdays"
          description: "The vrsky-mgmt-backup CronJob in vrsky-database has not completed a backup on two weekdays the cluster ran, or has stopped being scheduled. Read the last Job's log (kubectl -n vrsky-database logs job/<name>) and see docs/DR.md."

      # The same CronJob has been suspended for over 7 days although
      # vrsky-backup-config has existed for over 7 days (#432). The deploy
      # script unsuspends it only when the Secret is complete, and a human
      # may suspend it during a restore; MgmtBackupMissing is silent while it
      # is suspended, so a suspend that is never undone would stop backups
      # without a sound.
      # Not `for: 7d`: Prometheus runs in the cluster, which is parked every
      # night, and a pending alert's `for` clock resets after an outage over
      # an hour. Instead every kube_cronjob_spec_suspend sample of the last
      # 7 days must be 1 (min_over_time), so a single active sample, a
      # restore that suspends for a few hours included, keeps it quiet for
      # 7 days. Parked time has no samples and counts as suspended, since
      # nothing can unsuspend it then. The instant `== 1` makes it resolve
      # as soon as the CronJob is unsuspended or deleted.
      # `min by`, not `max by`: the series carry kube-state-metrics' pod and
      # instance, so a replaced pod (an upgrade, an eviction, a morning
      # start) begins a new series that holds only the latest samples. Its
      # window would be all 1 after a few hours of suspend; the old pod's
      # series still holds the active samples and must win. The instant
      # check takes `min` too, so one series that says active is enough.
      # The Secret's age comes from kube_secret_created (kube-state-metrics'
      # secrets collector, on in the chart defaults): the series only exists
      # while the Secret does. A CronJob that waits for its first Secret is
      # silent, and a Secret created today gives its owner 7 days to
      # unsuspend. If the secrets collector were ever turned off, this rule
      # would go quiet, as it was before.
      - alert: MgmtBackupSuspended
        expr: |
          (
              min by (namespace, cronjob) (min_over_time(kube_cronjob_spec_suspend{namespace="vrsky-database", cronjob="vrsky-mgmt-backup"}[7d])) == 1
            and on (namespace, cronjob)
              min by (namespace, cronjob) (kube_cronjob_spec_suspend{namespace="vrsky-database", cronjob="vrsky-mgmt-backup"}) == 1
          )
          and on (namespace)
            (time() - max by (namespace) (kube_secret_created{namespace="vrsky-database", secret="vrsky-backup-config"}) > 604800)
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Management-DB backup CronJob suspended for over 7 days"
          description: "The vrsky-mgmt-backup CronJob in vrsky-database has been suspended for over 7 days while the vrsky-backup-config Secret exists, so no backups are being taken. If no restore is in progress, unsuspend it or run Catch up (docs/operator/backup.md). If the deploy keeps it suspended, its log names the key the Secret is missing."

      # The same CronJob is gone while vrsky-backup-config exists (#526).
      # Deleted by hand or by a re-apply that failed halfway, its series end,
      # and the two rules above join on them, so they go quiet with it.
      # `unless`, not a bare absent(): on a morning start, before
      # kube-state-metrics' first scrape, the Secret's series is absent too,
      # so the left side is empty and nothing fires. A pending state doesn't
      # survive a parked night (far over the one-hour outage tolerance), so
      # each morning starts from inactive; `for: 30m` covers the scrape or
      # two in which kube-state-metrics can report the Secret before the
      # CronJob, at start or when its pod is replaced. `max by (namespace)`
      # drops the pod and instance labels (#473): the Secret one pod reports
      # is matched against the CronJob any pod reports, and a firing alert
      # keeps its labels across the change. With no Secret (before the human
      # setup, or renamed away during a restore) it is silent.
      - alert: MgmtBackupCronJobAbsent
        expr: |
          max by (namespace) (kube_secret_created{namespace="vrsky-database", secret="vrsky-backup-config"})
            unless on (namespace)
          max by (namespace) (kube_cronjob_created{namespace="vrsky-database", cronjob="vrsky-mgmt-backup"})
        for: 30m
        labels:
          severity: warning
          cronjob: vrsky-mgmt-backup
        annotations:
          summary: "Management-DB backup CronJob is missing"
          description: "The vrsky-backup-config Secret exists in vrsky-database but the vrsky-mgmt-backup CronJob does not, so no backups are being taken. Run Catch up, which re-applies it, and read its backup step's log, which says whether the CronJob came back active or suspended (docs/operator/backup.md)."
