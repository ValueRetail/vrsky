# Prometheus configuration for VRSky monitoring
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'vrsky-monitor'

# Alertmanager configuration (optional)
alerting:
  alertmanagers:
    - static_configs:
        - targets: []

# Load rules once and periodically evaluate them
rule_files: []

# Scrape configurations
scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # PostgreSQL Consumer metrics
  - job_name: 'postgres-consumer'
    static_configs:
      - targets: ['postgres-consumer:9090']
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s

  # PostgreSQL Producer metrics
  - job_name: 'postgres-producer'
    static_configs:
      - targets: ['postgres-producer:9090']
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s
