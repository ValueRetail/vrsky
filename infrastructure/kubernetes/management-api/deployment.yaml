apiVersion: apps/v1
kind: Deployment
metadata:
  name: vrsky-management-api
  namespace: vrsky-platform
  labels:
    app: vrsky-management-api
    component: management-api
    version: v1
spec:
  # >=2 replicas for HA (#138): no single point of failure for the control
  # plane / UI backend / worker service-token issuance. The API is stateless
  # (sessions in Postgres; OAuth refresh + usage rollup are gated cluster-wide
  # by Postgres advisory locks), so replicas scale horizontally. Scale higher
  # by raising this number.
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # maxUnavailable: 0 + maxSurge: 1 → a new replica becomes Ready before an
      # old one is removed, and the old one drains in-flight requests (#85), so
      # a rolling restart drops zero requests.
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: vrsky-management-api
  template:
    metadata:
      labels:
        app: vrsky-management-api
        component: management-api
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: vrsky-management-api

      containers:
      - name: management-api
        image: ghcr.io/valueretail/vrsky/management-api:latest
        imagePullPolicy: IfNotPresent

        # Resource limits - sized for test cluster (k3s single/small node)
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi

        # Environment variables
        env:
        - name: MGMT_API_DB_URL
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: connection_string
        # The entrypoint's pg-wait + `migrate up` use these (DB_HOST defaults to
        # the compose service name 'postgres-management', which doesn't exist in
        # k8s). DATABASE_URL drives migrate; DB_* drive pg_isready.
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: connection_string
        - name: DB_HOST
          value: "postgresql.vrsky-database.svc.cluster.local"
        - name: DB_PORT
          value: "5432"
        - name: DB_USER
          value: "vrsky"
        - name: DB_NAME
          value: "vrsky"
        - name: ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: encryption_key
        - name: MGMT_API_NATS_URL
          value: "nats://nats-platform.vrsky-platform.svc.cluster.local:4222"
        - name: MGMT_API_LISTEN
          value: ":3000"
        - name: MGMT_API_METRICS_LISTEN
          value: ":9090"
        - name: MGMT_API_CORS_ORIGINS
          value: "*"
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace

        # Ports
        ports:
        - name: http-api
          containerPort: 3000
          protocol: TCP
        - name: metrics
          containerPort: 9090
          protocol: TCP

        # Liveness probe - restart if API becomes unresponsive
        livenessProbe:
          httpGet:
            path: /healthz
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3

        # Readiness probe - remove from load balancer if not ready
        readinessProbe:
          httpGet:
            path: /readyz
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3

        # Security context - non-root, read-only filesystem
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL

        # Volume mounts for writable temp space
        volumeMounts:
        - name: tmp
          mountPath: /tmp

      # Volumes
      volumes:
      - name: tmp
        emptyDir: {}

      restartPolicy: Always
      terminationGracePeriodSeconds: 30
