apiVersion: v1
kind: Service
metadata:
  name: vrsky-management-api
  namespace: vrsky-platform
  labels:
    app: vrsky-management-api
    component: management-api
    version: v1
  annotations:
    # Prometheus service discovery. /metrics is served on the API listener
    # (pod port 3000); there is no separate metrics port.
    prometheus.io/scrape: "true"
    prometheus.io/port: "3000"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  selector:
    app: vrsky-management-api
  ports:
  - name: http-api
    # Application listens on container port 3000; exposed as 8080 within the cluster.
    port: 8080
    targetPort: 3000
    protocol: TCP
  sessionAffinity: None
