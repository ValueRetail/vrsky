apiVersion: apps/v1
kind: Deployment
metadata:
  name: nats-${TENANT_ID}-${INSTANCE_NUM}
  namespace: vrsky-tenants
  labels:
    app: nats
    component: tenant-messaging
    tenant-id: ${TENANT_ID}
    instance-num: "${INSTANCE_NUM}"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nats
      tenant-id: ${TENANT_ID}
      instance-num: "${INSTANCE_NUM}"
  template:
    metadata:
      labels:
        app: nats
        component: tenant-messaging
        tenant-id: ${TENANT_ID}
        instance-num: "${INSTANCE_NUM}"
    spec:
      containers:
        - name: nats
          image: nats:2.12-alpine

          # NOTE: --max_payload / --max_connections are nats-server CONFIG-file
          # options, NOT CLI flags. Passing them makes nats-server print usage
          # and exit(0) → CrashLoopBackOff. Keep to real flags (set those limits
          # via a config file if ever needed). Mirrors K8sNATSProvisioner.
          args:
            - --port
            - "4222"
            - --http_port
            - "8222"
            - --server_name
            - nats-${TENANT_ID}-${INSTANCE_NUM}

          ports:
            - containerPort: 4222
              name: client
            - containerPort: 8222
              name: monitor

          env:
            - name: TENANT_ID
              value: "${TENANT_ID}"
            - name: INSTANCE_NUM
              value: "${INSTANCE_NUM}"

          resources:
            # Modest requests so a tenant instance bin-packs onto small nodes
            # (the scheduling floor); limits stay generous for burst.
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 2
              memory: 4Gi

          livenessProbe:
            httpGet:
              path: /healthz
              port: 8222
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /healthz
              port: 8222
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3

          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - nats-server --signal quit
