# =============================================================================
# MinIO — single replica, single drive (#136)
# =============================================================================
# Production on AKS runs this Deployment (`minio` in vrsky-storage).
# infrastructure/azure/deploy-azure.sh applied it at the first bring-up, with
# local-path swapped for managed-csi. Since then the image was repointed to
# its ACR copy with `minio-images-acr.sh --repoint` and the claim moved to
# minio-data-small by hand (plans/disk-costs.md); today's deploy-azure.sh
# does the image swap itself on a fresh cluster. The deploy job never
# re-applies this file. The local k3d path (deploy-vrsky-platform.sh)
# applies it as it is. In production it holds the connectors' claim-check
# spill (payloads over 256 KiB, deploy-connectors-azure.sh), which expires
# after 8 days (setup-job.yaml).
#
# No erasure coding and no backup: while the pod is down, payloads over
# 256 KiB can't be published or delivered, and losing the disk loses
# spilled payloads that queued, retried or dead-lettered messages still
# point to.
#
# For HA use ONE of:
#   - statefulset-distributed.yaml  (self-hosted HA: 4-node erasure-coded pool)
#   - a managed object store (AWS S3 / GCS / Azure Blob)  <-- recommended
# See README "High Availability (production) — #136". Do not apply this file
# alongside statefulset-distributed.yaml (they share the `app: minio` selector).
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: vrsky-storage
  labels:
    app: minio
    component: object-storage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  strategy:
    type: Recreate # Ensure only one instance at a time
  template:
    metadata:
      labels:
        app: minio
        component: object-storage
    spec:
      containers:
        - name: minio
          image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
          args:
            - server
            - /data
            - --console-address
            - :9001

          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: accesskey
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: secretkey
            - name: MINIO_BROWSER
              valueFrom:
                configMapKeyRef:
                  name: minio-config
                  key: MINIO_BROWSER

          ports:
            - containerPort: 9000
              name: api
            - containerPort: 9001
              name: console

          volumeMounts:
            - name: data
              mountPath: /data

          resources:
            # Requests are what the scheduler reserves, not what a pod may use;
            # sized at >= 2x the 7-day peak (plans/cpu-request-headroom.md).
            # Limits stay generous for burst under real load.
            requests:
              cpu: 50m
              memory: 512Mi
            limits:
              cpu: 2
              memory: 4Gi

          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: 9000
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: minio-data-small
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  # Was minio-data at 100Gi. A claim cannot shrink, so the small one has a
  # new name (plans/disk-costs.md). Spill objects expire after 8 days
  # (setup-job.yaml) and use a few MB.
  name: minio-data-small
  namespace: vrsky-storage
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 8Gi
