# =============================================================================
# MinIO — DEV / SINGLE-NODE ONLY (#136)
# =============================================================================
# Single replica, single drive, no erasure coding: a node or PVC loss means
# data loss and downtime. Fine for local/POC clusters; NOT for production.
#
# For production use ONE of:
#   - statefulset-distributed.yaml  (self-hosted HA: 4-node erasure-coded pool)
#   - a managed object store (AWS S3 / GCS / Azure Blob)  <-- recommended
# See README "High Availability (production) — #136". Do not apply this file
# alongside statefulset-distributed.yaml (they share the `app: minio` selector).
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: vrsky-storage
  labels:
    app: minio
    component: object-storage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  strategy:
    type: Recreate # Ensure only one instance at a time
  template:
    metadata:
      labels:
        app: minio
        component: object-storage
    spec:
      containers:
        - name: minio
          image: minio/minio:RELEASE.2025-09-07T16-13-09Z
          args:
            - server
            - /data
            - --console-address
            - :9001

          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: accesskey
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: secretkey
            - name: MINIO_BROWSER
              valueFrom:
                configMapKeyRef:
                  name: minio-config
                  key: MINIO_BROWSER

          ports:
            - containerPort: 9000
              name: api
            - containerPort: 9001
              name: console

          volumeMounts:
            - name: data
              mountPath: /data

          resources:
            # Modest requests so it schedules on small/k3d nodes; limits stay
            # generous for real load.
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 2
              memory: 4Gi

          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: 9000
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: minio-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-data
  namespace: vrsky-storage
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 100Gi
