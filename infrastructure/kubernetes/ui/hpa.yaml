apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: vrsky-ui
  namespace: vrsky-ui
  labels:
    app: vrsky-ui
    component: frontend
    phase: "12"

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: vrsky-ui

  minReplicas: 2
  maxReplicas: 5

  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70

  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80

  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 50
        periodSeconds: 30
      - type: Pods
        value: 1
        periodSeconds: 30
      selectPolicy: Max
