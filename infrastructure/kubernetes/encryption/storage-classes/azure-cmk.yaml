# Azure Managed Disk with a customer-managed key (CMK).
#
# Prerequisites:
#  - The disk-encryption-set is created and references your Key Vault key.
#  - The AKS cluster identity has Reader + Crypto Service Encryption User
#    on the Key Vault.
#
# Replace DISK_ENCRYPTION_SET_RESOURCE before applying.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: vrsky-encrypted
provisioner: disk.csi.azure.com
parameters:
  skuName: Premium_LRS
  diskEncryptionSetID: "/subscriptions/REPLACE/resourceGroups/vrsky/providers/Microsoft.Compute/diskEncryptionSets/vrsky-des"
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
