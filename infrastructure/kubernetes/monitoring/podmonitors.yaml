# Scrape targets for the VRSky services (plans/monitoring-prod.md).
#
# PodMonitors rather than annotations: kube-prometheus-stack ignores the
# prometheus.io/* annotations, and the connector pods expose only their worker
# port in the Pod spec. port, portNumber and targetPort all generate a
# "keep" on the DECLARED container ports, so every form found nothing; the
# endpoint below names no port and rewrites __address__ to <pod IP>:8080
# instead. Picked up because the Prometheus values set
# podMonitorSelectorNilUsesHelmValues: false.
#
# The management-api serves /metrics on its main listener (:3000, port
# http-api — main.go mounts promhttp on the API mux). It never had a separate
# metrics listener: the :9090 port and MGMT_API_METRICS_LISTEN env that used
# to sit in its manifests were read by nothing, and scraping them was
# "connection refused".
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: vrsky-management-api
  namespace: vrsky-monitoring
spec:
  namespaceSelector:
    matchNames: [vrsky-platform]
  selector:
    matchLabels:
      app: vrsky-management-api
  podMetricsEndpoints:
    - port: http-api         # named containerPort 3000; /metrics is on the API mux
      path: /metrics
      interval: 30s
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: vrsky-alert-responder
  namespace: vrsky-monitoring
spec:
  namespaceSelector:
    matchNames: [vrsky-platform]
  selector:
    matchLabels:
      app: vrsky-alert-responder
  podMetricsEndpoints:
    - port: health           # named containerPort 8080; vrsky_responder_runs_total
      path: /metrics
      interval: 30s
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: vrsky-connectors
  namespace: vrsky-monitoring
spec:
  namespaceSelector:
    matchNames: [vrsky-platform]
  selector:
    matchLabels:
      tier: connector
  podMetricsEndpoints:
    - path: /metrics         # pkg/health server on :8080, not a declared container port
      interval: 30s
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_ip]
          regex: (.+)
          replacement: ${1}:8080
          targetLabel: __address__
        - sourceLabels: [__meta_kubernetes_pod_label_app]
          targetLabel: connector
---
# cert-manager's controller (#729), for the Postgres server certificate's
# expiry: certmanager_certificate_expiration_timestamp_seconds, alerted on by
# PostgresCertExpiring and PostgresCertMetricsAbsent in prometheus-rules.yml.
# The labels and the port (http-metrics, 9402) are what the cert-manager
# v1.13.3 chart renders for the controller pod; install-cert-manager.sh pins
# that version, and TestCertManagerPodMonitor fails when it changes so the
# two are checked again. The cainjector and webhook pods are left out: they
# carry other component labels and no certificate metrics.
#
# honorLabels: the metric's own `namespace` label is the Certificate's
# (vrsky-database). Without it Prometheus would rename it exported_namespace
# and set namespace="cert-manager", and the rules' matcher would find nothing.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: cert-manager
  namespace: vrsky-monitoring
spec:
  namespaceSelector:
    matchNames: [cert-manager]
  selector:
    matchLabels:
      app.kubernetes.io/name: cert-manager
      app.kubernetes.io/component: controller
  podMetricsEndpoints:
    - port: http-metrics     # named containerPort 9402 in the chart
      path: /metrics
      interval: 60s          # an expiry date; nothing here changes by the second
      honorLabels: true
