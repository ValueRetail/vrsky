# Centralized logging (#91): Loki + Promtail DaemonSet for K3s.
# Services log JSON to stdout; Promtail (one pod per node) tails pod logs,
# parses the JSON, promotes the standard fields to labels, and ships to Loki
# (7-day retention). Grafana reads Loki via the datasource in grafana-values.yaml.
#
# NOTE: Loki here is single-binary with a PVC for simplicity. For higher scale,
# use the Loki Helm chart in microservices/SSD mode backed by object storage
# (the issue's deployments/k8s/loki/ sizing: ~50 GB for 7 days at ~100 msg/s).
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: vrsky-monitoring
data:
  loki.yaml: |
    auth_enabled: false
    server:
      http_listen_port: 3100
    common:
      path_prefix: /loki
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory
    schema_config:
      configs:
        - from: 2024-01-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h
    limits_config:
      retention_period: 168h
      reject_old_samples: true
      reject_old_samples_max_age: 168h
    compactor:
      working_directory: /loki/compactor
      retention_enabled: true
      delete_request_store: filesystem
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: loki
  namespace: vrsky-monitoring
  labels: { app: loki }
spec:
  serviceName: loki
  replicas: 1
  selector:
    matchLabels: { app: loki }
  template:
    metadata:
      labels: { app: loki }
    spec:
      containers:
        - name: loki
          image: grafana/loki:3.1.0
          args: ["-config.file=/etc/loki/loki.yaml"]
          ports:
            - { containerPort: 3100, name: http }
          volumeMounts:
            - { name: config, mountPath: /etc/loki }
            - { name: data, mountPath: /loki }
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits: { cpu: "1", memory: "2Gi" }
      volumes:
        - name: config
          configMap: { name: loki-config }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 60Gi # ~50 GB of logs at 7-day retention + headroom
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: vrsky-monitoring
spec:
  selector: { app: loki }
  ports:
    - { name: http, port: 3100, targetPort: 3100 }
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: promtail
  namespace: vrsky-monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: promtail
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: promtail
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: promtail
subjects:
  - kind: ServiceAccount
    name: promtail
    namespace: vrsky-monitoring
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
  namespace: vrsky-monitoring
data:
  promtail.yaml: |
    server:
      http_listen_port: 9080
    positions:
      filename: /run/promtail/positions.yaml
    clients:
      - url: http://loki.vrsky-monitoring.svc.cluster.local:3100/loki/api/v1/push
    scrape_configs:
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: __host__
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: app
          - source_labels: [__meta_kubernetes_pod_uid, __meta_kubernetes_pod_container_name]
            target_label: __path__
            separator: /
            replacement: /var/log/pods/*$1/*.log
        pipeline_stages:
          - cri: {}
          - json:
              expressions:
                service: service
                level: level
                tenant_id: tenant_id
                pipeline_id: pipeline_id
                connection_id: connection_id
                trace_id: trace_id
          # connection IS the pipeline — backfill pipeline_id from connection_id
          # so {pipeline_id="…"} matches every service touching that pipeline.
          - template:
              source: pipeline_id
              template: '{{ if .pipeline_id }}{{ .pipeline_id }}{{ else }}{{ .connection_id }}{{ end }}'
          - labels:
              service:
              level:
              tenant_id:
              pipeline_id:
              connection_id:
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: promtail
  namespace: vrsky-monitoring
  labels: { app: promtail }
spec:
  selector:
    matchLabels: { app: promtail }
  template:
    metadata:
      labels: { app: promtail }
    spec:
      serviceAccountName: promtail
      containers:
        - name: promtail
          image: grafana/promtail:3.1.0
          args: ["-config.file=/etc/promtail/promtail.yaml"]
          volumeMounts:
            - { name: config, mountPath: /etc/promtail }
            - { name: run, mountPath: /run/promtail }
            - { name: pods, mountPath: /var/log/pods, readOnly: true }
          resources:
            requests: { cpu: "50m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
      volumes:
        - name: config
          configMap: { name: promtail-config }
        - name: run
          hostPath: { path: /run/promtail }
        - name: pods
          hostPath: { path: /var/log/pods }
