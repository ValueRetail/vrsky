apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nats-platform
  namespace: vrsky-platform
  labels:
    app: nats-platform
    component: messaging
spec:
  serviceName: nats-platform
  replicas: 3
  # Parallel start is required for a clustered JetStream StatefulSet: the default
  # OrderedReady policy won't start -1/-2 until -0 is Ready, but -0 can't reach a
  # RAFT meta leader (→ Ready) without its peers. Start all three at once so they
  # form the cluster together.
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: nats-platform
  template:
    metadata:
      labels:
        app: nats-platform
        component: messaging
    spec:
      # Ensure pods spread across nodes for HA
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: nats-platform
                topologyKey: kubernetes.io/hostname

      containers:
        - name: nats
          image: nats:2.12-alpine
          ports:
            - containerPort: 4222
              name: client
            - containerPort: 6222
              name: cluster
            - containerPort: 8222
              name: monitor

          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: CLUSTER_ADVERTISE
              value: $(POD_NAME).nats-platform.$(POD_NAMESPACE).svc.cluster.local

          command:
            - nats-server
            - --config
            - /etc/nats-config/nats.conf
            - --jetstream

          volumeMounts:
            - name: config
              mountPath: /etc/nats-config
            - name: jetstream
              mountPath: /data/jetstream

          resources:
            requests:
              cpu: 2
              memory: 4Gi
            limits:
              cpu: 4
              memory: 8Gi

          # Liveness only checks the server is up (js-server-only), NOT that a
          # JetStream meta leader exists — otherwise a node that's healthy but
          # still forming the cluster (or during a transient leader election)
          # gets killed, preventing the cluster from ever bootstrapping.
          livenessProbe:
            httpGet:
              path: /healthz?js-server-only=true
              port: 8222
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3

          # Startup probe gives the cluster generous time to elect a meta leader
          # before liveness begins enforcing.
          startupProbe:
            httpGet:
              path: /healthz?js-server-only=true
              port: 8222
            periodSeconds: 5
            failureThreshold: 30

          # Readiness uses the full health check (requires JetStream to be
          # ready) so the Service only routes to nodes that can serve.
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8222
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3

          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - nats-server --signal quit

      volumes:
        - name: config
          configMap:
            name: nats-config

  volumeClaimTemplates:
    - metadata:
        name: jetstream
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: local-path
        resources:
          requests:
            storage: 100Gi
