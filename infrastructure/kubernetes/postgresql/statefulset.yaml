# DEV / SINGLE-NODE ONLY (#137). This single-replica StatefulSet has no HA:
# a node or pod failure means a control-plane outage and risks data loss.
# For production use the CloudNativePG cluster (cnpg-cluster.yaml +
# cnpg-pooler.yaml) or a managed database — see README.md. Kept for local dev
# and minimal deployments.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgresql
  namespace: vrsky-database
  labels:
    app: postgresql
    component: database
spec:
  serviceName: postgresql
  replicas: 1
  selector:
    matchLabels:
      app: postgresql
  template:
    metadata:
      labels:
        app: postgresql
        component: database
    spec:
      containers:
        - name: postgresql
          image: postgres:18-alpine
          ports:
            - containerPort: 5432
              name: postgres

          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: postgres-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: vrsky-username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: vrsky-password
            - name: PGDATA
              valueFrom:
                configMapKeyRef:
                  name: postgres-config
                  key: PGDATA

          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: init-schema
              mountPath: /docker-entrypoint-initdb.d/init-schema.sql
              subPath: init-schema.sql
              readOnly: true

          resources:
            # Modest requests (scheduling floor) so it bin-packs onto small/k3d
            # nodes; limits stay generous for real load.
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 4
              memory: 8Gi

          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U $POSTGRES_USER -d $POSTGRES_DB
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U $POSTGRES_USER -d $POSTGRES_DB
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3

      volumes:
        - name: init-schema
          configMap:
            name: postgres-init-script
            items:
              - key: init-schema.sql
                path: init-schema.sql

  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: local-path
        resources:
          requests:
            storage: 50Gi
