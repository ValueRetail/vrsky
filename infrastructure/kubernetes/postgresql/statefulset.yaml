# The management database. Production on AKS runs this StatefulSet
# (`postgresql`, one replica): infrastructure/azure/deploy-azure.sh applied
# it at the first bring-up, with local-path swapped for managed-csi, and the
# deploy job never re-applies it. The local k3d path (deploy-vrsky-platform.sh)
# applies it as it is.
#
# One replica means no HA (#137): a node or pod failure takes the control
# plane down until the pod is back. Production has two backup layers for it:
# daily Azure Disk Backup snapshots of its disk and the weekday
# vrsky-mgmt-backup CronJob's logical dumps (docs/DR.md, which says how to
# check both run). cnpg-cluster.yaml is a CloudNativePG alternative that
# nothing deploys today; moving to it needs its own backup (see README.md).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgresql
  namespace: vrsky-database
  labels:
    app: postgresql
    component: database
spec:
  serviceName: postgresql
  replicas: 1
  selector:
    matchLabels:
      app: postgresql
  template:
    metadata:
      labels:
        app: postgresql
        component: database
    spec:
      containers:
        - name: postgresql
          image: postgres:18-alpine
          ports:
            - containerPort: 5432
              name: postgres

          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: postgres-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: vrsky-username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: vrsky-password
            - name: PGDATA
              valueFrom:
                configMapKeyRef:
                  name: postgres-config
                  key: PGDATA

          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            # NOTE: init-schema.sql is intentionally NOT mounted. golang-migrate
            # (management-api entrypoint) is the single source of truth for the
            # schema; loading the legacy init-schema.sql here created the tables
            # first and left migrate dirty at v6 (collision). See
            # docs/TIER3_VALIDATION.md.

          resources:
            # Modest requests (scheduling floor) so it bin-packs onto small/k3d
            # nodes; limits stay generous for real load.
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 4
              memory: 8Gi

          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U $POSTGRES_USER -d $POSTGRES_DB
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U $POSTGRES_USER -d $POSTGRES_DB
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3

      volumes: []

  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: local-path
        resources:
          requests:
            storage: 50Gi
