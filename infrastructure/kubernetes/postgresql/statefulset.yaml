# The management database. Production on AKS runs this StatefulSet
# (`postgresql`, one replica): infrastructure/azure/deploy-azure.sh applied
# it at the first bring-up, with local-path swapped for managed-csi, and the
# deploy job never re-applies it. The local k3d path (deploy-vrsky-platform.sh)
# applies it as it is.
#
# One replica means no HA (#137): a node or pod failure takes the control
# plane down until the pod is back. Production has two backup layers for it:
# daily Azure Disk Backup snapshots of its disk and the weekday
# vrsky-mgmt-backup CronJob's logical dumps (docs/DR.md, which says how to
# check both run). cnpg-cluster.yaml is a CloudNativePG alternative that
# nothing deploys today; moving to it needs its own backup (see README.md).
#
# TLS (#453): ssl = on, with the certificate cert-manager issues in tls.yaml.
# Plain connections from other pods are refused (#729): Postgres reads its
# pg_hba.conf from the ConfigMap below (hba_file), not from the data volume,
# so a snapshot restore or a new volume refuses them too. The production
# StatefulSet is applied by hand (infrastructure/azure/postgres-tls.sh
# server), not by the deploy job; README.md has the steps and the rollback.
#
# The ConfigMap is in this file, ahead of the StatefulSet, so every
# `kubectl apply -f statefulset.yaml` creates it before the pod that needs it.
# Postgres refuses to start without the file.
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-hba
  namespace: vrsky-database
  labels:
    app: postgresql
    component: database
data:
  # The image's own lines (initdb in postgres:18-alpine), with the last rule
  # made hostssl. That is what production's file on the volume has said since
  # the hand edit of 2026-11-03, so applying this changes nothing for clients.
  #
  # - local and loopback stay trust: the entrypoint's first-start server
  #   (no TCP), the pg_isready probes and `kubectl exec psql` use the Unix
  #   socket; `kubectl port-forward` arrives on 127.0.0.1.
  # - every other address must use TLS, and still needs the password
  #   (scram-sha-256).
  #
  # Postgres reads this at start and on pg_reload_conf(). The volume is not a
  # subPath, so an edit here reaches the pod within a minute or two and a
  # reload picks it up (README.md, rollback). A file Postgres cannot parse
  # stops it at start; on a reload it keeps the old rules.
  pg_hba.conf: |
    # TYPE  DATABASE        USER            ADDRESS                 METHOD
    local   all             all                                     trust
    host    all             all             127.0.0.1/32            trust
    host    all             all             ::1/128                 trust
    local   replication     all                                     trust
    host    replication     all             127.0.0.1/32            trust
    host    replication     all             ::1/128                 trust
    hostssl all             all             all                     scram-sha-256
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgresql
  namespace: vrsky-database
  labels:
    app: postgresql
    component: database
spec:
  serviceName: postgresql
  replicas: 1
  selector:
    matchLabels:
      app: postgresql
  template:
    metadata:
      labels:
        app: postgresql
        component: database
    spec:
      initContainers:
        # Postgres refuses a private key that others can read, and a Secret
        # volume is root's. So copy the pair into memory-backed storage owned
        # by the postgres user (uid/gid 70 in the Alpine image) with mode
        # 0600. fsGroup would do it for the key, but it would also change the
        # modes under the data directory, and Postgres rejects a group-writable
        # one. The copy is made at every pod start, which is how a renewed
        # certificate gets picked up (see tls.yaml). Order matters: chmod
        # before chown, because after chown root is no longer the owner and
        # the container has no CAP_FOWNER.
        - name: tls-perms
          image: postgres:18-alpine
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              cp /tls-src/tls.crt /tls/tls.crt
              cp /tls-src/tls.key /tls/tls.key
              chmod 0644 /tls/tls.crt
              chmod 0600 /tls/tls.key
              chown 70:70 /tls/tls.crt /tls/tls.key
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
          volumeMounts:
            - name: tls-src
              mountPath: /tls-src
              readOnly: true
            - name: tls
              mountPath: /tls
      containers:
        - name: postgresql
          image: postgres:18-alpine
          # The image passes arguments that start with a dash on to `postgres`.
          args:
            - -c
            - ssl=on
            - -c
            - ssl_cert_file=/etc/postgresql/tls/tls.crt
            - -c
            - ssl_key_file=/etc/postgresql/tls/tls.key
            - -c
            - ssl_min_protocol_version=TLSv1.2
            # The ConfigMap postgres-hba above, instead of $PGDATA/pg_hba.conf.
            - -c
            - hba_file=/etc/postgresql/hba/pg_hba.conf
          ports:
            - containerPort: 5432
              name: postgres

          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: postgres-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: vrsky-username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: vrsky-password
            - name: PGDATA
              valueFrom:
                configMapKeyRef:
                  name: postgres-config
                  key: PGDATA

          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: tls
              mountPath: /etc/postgresql/tls
              readOnly: true
            # A directory mount, not a subPath: a subPath file never changes
            # after the pod starts, and the rollback edits the ConfigMap.
            - name: hba
              mountPath: /etc/postgresql/hba
              readOnly: true
            # NOTE: init-schema.sql is intentionally NOT mounted. golang-migrate
            # (management-api entrypoint) is the single source of truth for the
            # schema; loading the legacy init-schema.sql here created the tables
            # first and left migrate dirty at v6 (collision). See
            # docs/TIER3_VALIDATION.md.

          resources:
            # Modest requests (scheduling floor) so it bin-packs onto small/k3d
            # nodes; limits stay generous for real load.
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 4
              memory: 8Gi

          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U $POSTGRES_USER -d $POSTGRES_DB
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U $POSTGRES_USER -d $POSTGRES_DB
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3

      volumes:
        # The certificate and key cert-manager issued (tls.yaml). Read by the
        # init container only.
        - name: tls-src
          secret:
            secretName: postgresql-tls
            defaultMode: 0444
        # The copy Postgres reads. In memory, so the key is never written to
        # a disk.
        - name: tls
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        # pg_hba.conf (#729). Not optional: without it Postgres does not
        # start, and a pod stuck in ContainerCreating says why more plainly.
        - name: hba
          configMap:
            name: postgres-hba

  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: local-path
        resources:
          requests:
            storage: 50Gi
