# Encrypted logical backup of the management Postgres (#86, #395).
#
# vrsky-cli backup: pg_dump (custom format) -> gzip -> AES-256-GCM with the
# shared ENCRYPTION_KEY -> upload to Azure Blob storage (container
# vrsky-backups) as mgmt-backups/management_db-<UTC timestamp>.dump.gz.enc.
#
# Weekdays at 12:00 Oslo time, while the cluster runs (it is parked 16:00 to
# 07:00 and at weekends; nothing changes then). startingDeadlineSeconds keeps a
# run missed while parked from firing hours late at start-up; a start within
# the hour after noon still gets that day's run.
#
# Applied by infrastructure/azure/deploy-backup-azure.sh (the deploy job and
# Catch up). It is suspended here and stays suspended until the
# `vrsky-backup-config` Secret exists in vrsky-database; that Secret is created
# by a human with `kubectl create secret generic` (README.md) and never comes
# from the repo. Every setting below that is not a credential lives in the
# manifest; every credential comes from that Secret.
#
# The image pulls :latest at every run, so a rebuilt vrsky-cli needs no
# re-apply. Alert: MgmtBackupMissing (infrastructure/prometheus-rules.yml).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: vrsky-mgmt-backup
  namespace: vrsky-database
  labels:
    app: vrsky-mgmt-backup
spec:
  schedule: "0 12 * * 1-5"
  timeZone: Europe/Oslo
  startingDeadlineSeconds: 3600
  concurrencyPolicy: Forbid
  suspend: true # deploy-backup-azure.sh sets false once vrsky-backup-config exists
  # The alert counts failed Jobs since the last success, so keep enough of both.
  successfulJobsHistoryLimit: 7
  failedJobsHistoryLimit: 7
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 3600 # cap one run at 1h (a hung pg_dump or upload)
      template:
        metadata:
          labels:
            app: vrsky-mgmt-backup
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          imagePullSecrets:
            - name: acr-pull
          securityContext:
            # uid/gid 70 is the `postgres` user of the postgres:18-alpine base.
            runAsNonRoot: true
            runAsUser: 70
            runAsGroup: 70
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: backup
              image: vrskyprodacr.azurecr.io/vrsky/vrsky-cli:latest
              imagePullPolicy: Always
              args: ["backup"]
              envFrom:
                - secretRef:
                    name: vrsky-backup-config
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: "100m"
                  memory: "128Mi"
                limits:
                  cpu: "500m"
                  memory: "512Mi"
          volumes:
            - name: tmp
              emptyDir:
                sizeLimit: 256Mi
