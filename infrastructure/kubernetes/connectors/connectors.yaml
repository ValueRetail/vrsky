---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vrsky-files
  namespace: vrsky-platform
spec:
  accessModes:
  - ReadWriteMany
  storageClassName: azurefile-csi
  resources:
    requests:
      storage: 50Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vrsky-sitoo-consumer
  namespace: vrsky-platform
  labels:
    app: vrsky-sitoo-consumer
    tier: connector
    role: consumer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vrsky-sitoo-consumer
  template:
    metadata:
      labels:
        app: vrsky-sitoo-consumer
        tier: connector
        role: consumer
    spec:
      containers:
      - name: sitoo-consumer
        image: vrskyprodacr.azurecr.io/vrsky/sitoo-consumer:latest
        env:
        - name: NATS_URL
          value: "nats://nats-platform.vrsky-platform.svc.cluster.local:4222"
        - name: LOG_LEVEL
          value: "info"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: connection_string
        - name: ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: encryption_key
        # Claim-check spill store (#187/#201): consumers offload >256KiB
        # payloads; producers rehydrate/stream them. Prereq: minio-credentials
        # secret copied into this namespace from vrsky-storage.
        - name: PAYLOAD_STORE_PROVIDER
          value: "s3"
        - name: PAYLOAD_STORE_BUCKET
          value: "vrsky-objects"
        - name: PAYLOAD_STORE_ENDPOINT
          value: "http://minio.vrsky-storage.svc.cluster.local:9000"
        - name: PAYLOAD_STORE_REGION
          value: "us-east-1"
        - name: PAYLOAD_STORE_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: minio-credentials
              key: accesskey
        - name: PAYLOAD_STORE_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: minio-credentials
              key: secretkey
        - name: WORKER_HTTP_PORT
          value: "9260"
        ports:
        - name: http
          containerPort: 9260
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 250m
            # 512Mi, NOT 128Mi: a producer that does not implement the ADR 0001
            # streaming path buffers an offloaded payload up to the rehydrate
            # cap (PAYLOAD_REHYDRATE_MAX_BYTES, 128 MiB default). A 128Mi limit
            # OOM-kills the pod before the cap can reject anything.
            memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: vrsky-sitoo-consumer
  namespace: vrsky-platform
  labels:
    app: vrsky-sitoo-consumer
spec:
  selector:
    app: vrsky-sitoo-consumer
  ports:
  - name: http
    port: 9260
    targetPort: 9260
