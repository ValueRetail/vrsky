---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vrsky-sitoo-consumer
  namespace: vrsky-platform
  labels:
    app: vrsky-sitoo-consumer
    tier: connector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vrsky-sitoo-consumer
  template:
    metadata:
      labels:
        app: vrsky-sitoo-consumer
        tier: connector
    spec:
      containers:
      - name: sitoo-consumer
        image: vrskyprodacr.azurecr.io/vrsky/sitoo-consumer:latest
        env:
        - name: NATS_URL
          value: "nats://nats-platform.vrsky-platform.svc.cluster.local:4222"
        - name: LOG_LEVEL
          value: "info"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: connection_string
        - name: ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: encryption_key
        - name: WORKER_HTTP_PORT
          value: "9260"
        ports:
        - name: webhook
          containerPort: 9260
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: vrsky-sitoo-consumer
  namespace: vrsky-platform
  labels:
    app: vrsky-sitoo-consumer
spec:
  selector:
    app: vrsky-sitoo-consumer
  ports:
  - name: webhook
    port: 9260
    targetPort: 9260
