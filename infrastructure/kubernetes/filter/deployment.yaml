apiVersion: apps/v1
kind: Deployment
metadata:
  name: vrsky-filter
  namespace: vrsky-platform
  labels:
    app: vrsky-filter
    component: filter
    phase: 1e
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: vrsky-filter
  template:
    metadata:
      labels:
        app: vrsky-filter
        component: filter
        phase: 1e
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      # Pod anti-affinity for HA across nodes
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - vrsky-filter
              topologyKey: kubernetes.io/hostname
      
      # Service account
      serviceAccountName: default
      
      containers:
      - name: filter
        image: vrsky/filter:latest
        imagePullPolicy: Always
        
        # Resource limits
        resources:
          requests:
            cpu: 1000m
            memory: 2Gi
          limits:
            cpu: 2000m
            memory: 4Gi
        
        # Environment variables
        env:
        - name: NATS_URL
          value: "nats://nats-platform:4222"
        - name: FILTER_ID
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: INPUT_TOPIC
          value: "postgres.changes"
        - name: OUTPUT_TOPIC
          value: "filter.output"
        - name: REJECTION_TOPIC
          value: "filter.rejection"
        - name: LOG_LEVEL
          value: "info"
        
        # Ports
        ports:
        - name: nats-client
          containerPort: 9090
          protocol: TCP
        
        # Liveness probe - restart if unhealthy
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - "nc -z 127.0.0.1 9090"
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        
        # Readiness probe - remove from load balancer if not ready
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - "nc -z 127.0.0.1 9090"
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        
        # Security context
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        
        # Volume mounts
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: cache
          mountPath: /app/cache
      
      # Volumes
      volumes:
      - name: tmp
        emptyDir: {}
      - name: cache
        emptyDir: {}
      
      # Restart policy
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
