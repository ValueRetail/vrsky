# PLACEHOLDER: Data Plane Service Deployment
# ============================================
# Phase: Placeholder (to be fully defined in Phase 4)
# Role: TBD - likely Pipeline Orchestrator or Message Processing Runtime
# Reference: Modeled after filter/deployment.yaml structure
#
# TODO (Phase 4): Clarify Data Plane responsibilities:
#   - Option A: Pipeline execution runtime (starts/stops consumer+producer+converter+filter chains)
#   - Option B: Data routing layer between NATS topics
#   - Option C: Stateless job worker spawned per integration run
#
# For now: minimal 1-replica placeholder that connects to NATS.
# Do NOT add business logic here until Phase 4 scope is confirmed.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: vrsky-data-plane
  namespace: vrsky-platform
  labels:
    app: vrsky-data-plane
    component: data-plane
    phase: placeholder
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: vrsky-data-plane
  template:
    metadata:
      labels:
        app: vrsky-data-plane
        component: data-plane
        phase: placeholder
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: default

      containers:
      - name: data-plane
        image: ghcr.io/valueretail/vrsky/data-plane:latest
        imagePullPolicy: IfNotPresent

        # Resource limits - conservative for placeholder (adjust in Phase 4)
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi

        # Environment variables - minimal NATS connectivity
        env:
        - name: NATS_URL
          value: "nats://nats-platform.vrsky-platform.svc.cluster.local:4222"
        - name: DATA_PLANE_ID
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: LOG_LEVEL
          value: "info"
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace

        # Ports - metrics only (no HTTP server until Phase 4 defines service interface)
        ports:
        - name: metrics
          containerPort: 9090
          protocol: TCP

        # NOTE: Health probes disabled - placeholder has no HTTP server yet.
        # TODO (Phase 4): Implement /health and /ready endpoints, then enable:
        #   livenessProbe:
        #     httpGet:
        #       path: /health
        #       port: 8080
        #   readinessProbe:
        #     httpGet:
        #       path: /ready
        #       port: 8080

        # Security context - non-root, read-only filesystem
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL

        # Volume mounts
        volumeMounts:
        - name: tmp
          mountPath: /tmp

      # Volumes
      volumes:
      - name: tmp
        emptyDir: {}

      restartPolicy: Always
      terminationGracePeriodSeconds: 30
