apiVersion: v1
kind: Service
metadata:
  name: vrsky-converter
  namespace: vrsky-platform
  labels:
    app: vrsky-converter
    component: converter
    phase: 4
spec:
  type: ClusterIP
  selector:
    app: vrsky-converter
  ports:
  - name: http-metrics
    port: 8080
    targetPort: 8080
    protocol: TCP
  - name: grpc
    port: 9090
    targetPort: 9090
    protocol: TCP
  sessionAffinity: None
