apiVersion: apps/v1
kind: Deployment
metadata:
  name: vrsky-converter
  namespace: vrsky-platform
  labels:
    app: vrsky-converter
    component: converter
    phase: 4
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: vrsky-converter
  template:
    metadata:
      labels:
        app: vrsky-converter
        component: converter
        phase: 4
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      # Pod anti-affinity for HA across nodes
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - vrsky-converter
              topologyKey: kubernetes.io/hostname
      
      # Service account
      serviceAccountName: default
      
      containers:
      - name: converter
        image: localhost:5000/vrsky/converter:latest
        imagePullPolicy: IfNotPresent
        
        # Resource limits - optimized for data transformation workloads
        resources:
          requests:
            cpu: 1000m
            memory: 2Gi
          limits:
            cpu: 2000m
            memory: 4Gi
        
        # Environment variables
        env:
        - name: CONVERTER_PORT
          value: "8080"
        - name: NATS_URL
          value: "nats://nats:4222"
        - name: CONFIG_SERVICE_URL
          value: "http://config-service:8080"
        - name: POSTGRES_URL
          value: "postgres://postgres:5432"
        - name: MINIO_ENDPOINT
          value: "minio:9000"
        - name: LOG_LEVEL
          value: "info"
        - name: CACHE_TTL
          value: "300"
        - name: MAX_RETRIES
          value: "3"
        - name: RETRY_BACKOFF
          value: "exponential"
        - name: CONVERTER_ID
          valueFrom:
            fieldRef:
              fieldPath: metadata.labels['app']
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        
        # Ports
        ports:
        - name: http-metrics
          containerPort: 8080
          protocol: TCP
        - name: grpc
          containerPort: 9090
          protocol: TCP
        
        # Liveness probe - restart if converter becomes unhealthy
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        
        # Readiness probe - remove from service if not ready
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        
        # Security context - non-root, read-only filesystem
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        
        # Volume mounts
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: cache
          mountPath: /app/cache
        - name: wasm-modules
          mountPath: /app/wasm-modules
      
      # Volumes
      volumes:
      - name: tmp
        emptyDir: {}
      - name: cache
        emptyDir: {}
      - name: wasm-modules
        emptyDir: {}
      
      # Restart policy
      restartPolicy: Always
      terminationGracePeriodSeconds: 15
