# Keep one data-filter replica up through node drains/upgrades (HA pairing for
# the 2-replica deployment).
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: vrsky-data-filter
  namespace: vrsky-platform
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: vrsky-data-filter
